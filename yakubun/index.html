<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分数の約分れんしゅう</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .back-site-wrap {
      margin: 14px 0 10px;
      text-align: left;
    }
    .back-site-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffffff;
      border: 2px solid #e6d8c8;
      color: #6b4f3a;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.08);
    }
    .back-site-btn:hover {
      background: #fff7ea;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="back-site-wrap">
      <a class="back-site-btn" href="https://sunedtech-hp.pages.dev/">← サイトに戻る</a>
    </div>
    <h1 class="title">分数の約分れんしゅう</h1>

    <div class="level-row">
      <button class="lvl-btn active" data-level="1">かんたん</button>
      <button class="lvl-btn" data-level="2">ふつう</button>
      <button class="lvl-btn" data-level="3">むずかしい</button>
    </div>

    <div class="stats-grid">
      <div class="stat"><div class="stat-n" id="correct-count">0</div><div class="stat-l">せいかい</div></div>
      <div class="stat"><div class="stat-n" id="wrong-count">0</div><div class="stat-l">ふせいかい</div></div>
      <div class="stat"><div class="stat-n" id="streak-count">0</div><div class="stat-l">れんぞく</div></div>
    </div>

    <div class="qcard">
      <div class="instruct">つぎの分数を約分してね</div>
      <div class="frow">
        <div class="frac">
          <span class="fnum" id="numerator">12</span>
          <div class="fbar"></div>
          <span class="fden" id="denominator">18</span>
        </div>
        <span class="eq">=</span>
        <div class="frac">
          <input class="ainput" id="ans-num" type="number" min="1" placeholder="?" autocomplete="off" />
          <div class="fbar answer-bar"></div>
          <input class="ainput" id="ans-den" type="number" min="1" placeholder="?" autocomplete="off" />
        </div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="hinttext" id="hint"></div>
    </div>

    <div class="btnrow">
      <button class="btn-check" id="check-btn">こたえあわせ</button>
      <div class="btn-row2">
        <button class="btn-sub" id="hint-btn">ヒントをみる</button>
        <button class="btn-sub" id="next-btn">つぎのもんだい</button>
      </div>
      <button class="btn-reset" id="reset-btn">全部リセットする</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
