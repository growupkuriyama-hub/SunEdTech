gree voluntarily. It protects autonomy in medical and scientific research. Consent obtained through pressure is ethically weak.","q":"What does informed consent protect?","opts":["Participants' autonomy","Researchers from all questions","The removal of all risks","The secrecy of every result"],"ans":0,"exp":"Informed consent supports the participant's right to decide freely based on relevant information.","hints":["informed consent = インフォームド・コンセント。","autonomy = 自律。","十分な情報に基づく同意です。"]},{"cat":"Complex Systems","passage":"<span class=\"kw\">Nonlinear</span> systems can respond disproportionately to small changes. A small input may produce a large effect, or a large input may produce little effect. This makes prediction more challenging.","q":"Why are nonlinear systems hard to predict?","opts":["Responses may be disproportionate to inputs","They always change in a straight line","They contain no variables","They never respond to anything"],"ans":0,"exp":"Nonlinear responses are not simply proportional, making outcomes harder to forecast.","hints":["nonlinear = 非線形。","disproportionate = 釣り合わない。","入力と結果が単純比例しません。"]},{"cat":"Cognitive Science","passage":"<span class=\"kw\">Metacognition</span> is thinking about one’s own thinking. Learners use it when they monitor what they understand and choose strategies for improvement. Strong metacognition can make study more efficient.","q":"What does metacognition involve?","opts":["Monitoring one's own understanding","Forgetting all strategies","Avoiding reflection","Repeating words without awareness"],"ans":0,"exp":"Metacognition includes awareness and regulation of one's own learning process.","hints":["meta- = 一段上から見る。","cognition = 認知。","自分の理解を自分で点検する力です。"]},{"cat":"Economics","passage":"<span class=\"kw\">Information asymmetry</span> exists when one side of a transaction knows more than the other. This can lead to mistrust or inefficient outcomes. Certification and disclosure rules can reduce the problem.","q":"What can reduce information asymmetry?","opts":["Certification and disclosure rules","Hiding more information","Removing all standards","Ignoring quality differences"],"ans":0,"exp":"Providing credible information can reduce the knowledge gap between parties.","hints":["information asymmetry = 情報の非対称性。","one side knows more がヒントです。","認証や情報開示で差を小さくできます。"]},{"cat":"Environmental Policy","passage":"<span class=\"kw\">Precautionary</span> reasoning supports action when a serious risk is plausible even if evidence is incomplete. Critics worry that excessive caution can block useful innovation. Policy must balance uncertainty and potential harm.","q":"What does precautionary reasoning support?","opts":["Action under plausible serious risk","Ignoring all possible harm","Waiting for perfect certainty in every case","Banning evidence from policy"],"ans":0,"exp":"The precautionary approach treats serious potential harm as a reason for protective action.","hints":["precautionary = 予防的な。","plausible serious risk が重要です。","不確実でも深刻な危険があり得るなら対策します。"]},{"cat":"Artificial Intelligence","passage":"<span class=\"kw\">Interpretability</span> refers to how easily humans can understand why a model produced a result. High accuracy alone may not be enough in medicine or law. People may need reasons, not just predictions.","q":"Why may interpretability matter?","opts":["People may need reasons for decisions","Accuracy is always harmful","Models never make predictions","Medicine avoids evidence"],"ans":0,"exp":"In high-stakes settings, users often need understandable reasons behind outputs.","hints":["interpretability = 解釈可能性。","why a model produced a result がヒントです。","結果だけでなく理由が必要な場面があります。"]},{"cat":"Ecology","passage":"<span class=\"kw\">Ecosystem services</span> are benefits that humans receive from nature. Pollination, water purification, and flood protection are examples. Losing ecosystems can therefore create hidden economic costs.","q":"Which is an ecosystem service?","opts":["Pollination","A broken keyboard","A private password","A fictional planet"],"ans":0,"exp":"Pollination is a natural process that supports human food production.","hints":["ecosystem services = 生態系サービス。","benefits from nature がヒントです。","受粉や水の浄化などが例です。"]}]}};
    const GRADES = {
      pre2: { label: "準２級", sub: "高校基礎", note: "英検準２級目安。理科・数学の基本語彙を、短めの英文で確認します。" },
      grade2: { label: "２級", sub: "高校標準", note: "英検２級目安。高校内容に近い科学・社会・論理の語彙を、標準的な英文で確認します。" },
      pre1: { label: "準１級", sub: "学術入門", note: "英検準１級目安。社会・科学・研究でよく出る抽象語彙と論理関係を扱います。" }
    };
    const LEVELS = {
      l1: { label: "Level 1", sub: "基礎" },
      l2: { label: "Level 2", sub: "標準" },
      l3: { label: "Level 3", sub: "発展" }
    };

    const state = { grade: "pre2", level: "l1", quiz: [], cur: 0, score: 0, answered: false, hintsShown: 0 };

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"]/g, s => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[s]));
    }

    function selectGrade(grade) {
      state.grade = grade;
      state.level = "l1";
      startQuiz();
    }

    function selectLevel(level) {
      state.level = level;
      startQuiz();
    }

    function startQuiz() {
      const pool = BANKS[state.grade][state.level] || [];
      state.quiz = shuffle(pool).slice(0, 5);
      state.cur = 0;
      state.score = 0;
      state.answered = false;
      state.hintsShown = 0;
      render();
    }

    function selectorHtml() {
      const gradeButtons = Object.keys(GRADES).map(key => `
        <button class="sel-btn ${state.grade === key ? "active" : ""}" onclick="selectGrade('${key}')">
          ${GRADES[key].label}<small>${GRADES[key].sub}</small>
        </button>`).join("");
      const levelButtons = Object.keys(LEVELS).map(key => `
        <button class="sel-btn ${state.level === key ? "active" : ""}" onclick="selectLevel('${key}')">
          ${LEVELS[key].label}<small>${LEVELS[key].sub}</small>
        </button>`).join("");
      return `
        <div class="selector">
          <div>
            <div class="selector-label">級を選ぶ</div>
            <div class="btn-grid">${gradeButtons}</div>
          </div>
          <div>
            <div class="selector-label">同じ級の中でレベルを選ぶ</div>
            <div class="btn-grid">${levelButtons}</div>
          </div>
          <div class="course-note"><strong>${GRADES[state.grade].label} / ${LEVELS[state.level].label}</strong>：${GRADES[state.grade].note} 問題ストックは全${BANKS[state.grade][state.level].length}問です。毎回ランダムに5問を出題します。</div>
        </div>`;
    }

    function render() {
      const app = document.getElementById("app");
      if (!state.quiz.length) {
        app.innerHTML = selectorHtml() + '<div class="quiz-card">このコースにはまだ問題がありません。</div>';
        return;
      }
      if (state.cur >= state.quiz.length) {
        renderResult(app);
        return;
      }
      const q = state.quiz[state.cur];
      const total = state.quiz.length;
      const pct = Math.round((state.cur / total) * 100);
      app.innerHTML = selectorHtml() + `
        <div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
        <article class="quiz-card">
          <div class="q-meta">
            <span class="badge">${escapeHtml(q.cat)}</span>
            <span class="badge">${GRADES[state.grade].label}</span>
            <span class="badge">${LEVELS[state.level].label}</span>
            <span class="counter">Question ${state.cur + 1} / ${total}</span>
          </div>
          <div class="passage">${q.passage}</div>
          <div class="q-text">${escapeHtml(q.q)}</div>
          <div class="options" id="opts">
            ${q.opts.map((o, i) => `<button class="opt-btn" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`).join("")}
          </div>
          <div class="hint-row">
            <button class="hint-btn" id="hb1" onclick="showHint(1)">Hint 1</button>
            <button class="hint-btn" id="hb2" onclick="showHint(2)" disabled>Hint 2</button>
            <button class="hint-btn" id="hb3" onclick="showHint(3)" disabled>Hint 3</button>
          </div>
          <div id="hint-area"></div>
          <div id="feedback"></div>
          <div id="next-area"></div>
        </article>`;
    }

    function showHint(n) {
      const q = state.quiz[state.cur];
      state.hintsShown = n;
      let html = '<div class="hint-box">';
      for (let i = 0; i < n; i++) html += `<p><strong>Hint ${i + 1}:</strong> ${escapeHtml(q.hints[i])}</p>`;
      html += '</div>';
      document.getElementById("hint-area").innerHTML = html;
      if (n < 3) document.getElementById(`hb${n + 1}`).disabled = false;
      document.getElementById(`hb${n}`).disabled = true;
    }

    function choose(idx) {
      if (state.answered) return;
      state.answered = true;
      const q = state.quiz[state.cur];
      document.querySelectorAll(".opt-btn").forEach((b, i) => {
        b.disabled = true;
        if (i === q.ans) b.classList.add("correct");
        else if (i === idx && idx !== q.ans) b.classList.add("wrong");
      });
      const fb = document.getElementById("feedback");
      if (idx === q.ans) {
        state.score++;
        fb.innerHTML = `<div class="feedback ok"><strong>Correct!</strong> ${escapeHtml(q.exp)}</div>`;
      } else {
        fb.innerHTML = `<div class="feedback ng"><strong>Incorrect.</strong> The correct answer is <strong>${String.fromCharCode(65 + q.ans)}. ${escapeHtml(q.opts[q.ans])}</strong>. ${escapeHtml(q.exp)}</div>`;
      }
      const label = state.cur < state.quiz.length - 1 ? "Next question →" : "See results →";
      document.getElementById("next-area").innerHTML = `<button class="next-btn" onclick="nextQ()">${label}</button>`;
    }

    function nextQ() {
      state.cur++;
      state.answered = false;
      state.hintsShown = 0;
      render();
    }

    function renderResult(app) {
      const total = state.quiz.length;
      const pct = Math.round((state.score / total) * 100);
      let msg = "Keep practicing. Read the explanation for each missed question and try a different level next.";
      if (pct >= 90) msg = "Excellent. This level is probably comfortable for you, so try the next level or the next EIKEN grade.";
      else if (pct >= 70) msg = "Good work. You are close to stable mastery; review the missed vocabulary and try again.";
      else if (pct >= 50) msg = "Nice effort. The level is useful training, but the key terms still need review.";
      app.innerHTML = selectorHtml() + `
        <div class="progress-bg"><div class="progress-fill" style="width:100%"></div></div>
        <div class="quiz-card result">
          <div class="score">${state.score} / ${total}</div>
          <div class="score-sub">${GRADES[state.grade].label}・${LEVELS[state.level].label}：${pct}%</div>
          <div class="result-msg">${escapeHtml(msg)}</div>
          <div class="mini-actions">
            <button class="try-btn" onclick="startQuiz()">同じレベルをもう一度</button>
            <button class="plain-btn" onclick="selectLevel('l1')">Level 1へ</button>
            <button class="plain-btn" onclick="selectLevel('l2')">Level 2へ</button>
            <button class="plain-btn" onclick="selectLevel('l3')">Level 3へ</button>
          </div>
        </div>`;
    }

    startQuiz();
  </script>
</body>
</html>
