<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <title>レベル別 英検トレーニング 英語DE科学 | SunEdTech</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fbfaf7;
      --card: #ffffff;
      --card-2: #f2efe9;
      --text: #1d1d1f;
      --muted: #6b6863;
      --line: rgba(29, 29, 31, 0.14);
      --line-strong: rgba(29, 29, 31, 0.28);
      --accent: #6157d8;
      --accent-2: #eeeefe;
      --accent-3: #3c3489;
      --ok-bg: #eaf5e4;
      --ok-text: #163708;
      --ng-bg: #fdebec;
      --ng-text: #521215;
      --hint-bg: #fff2d7;
      --hint-text: #4b2b02;
      --shadow: 0 18px 45px rgba(30, 26, 20, 0.08);
      --radius: 18px;
      --radius-sm: 10px;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151515;
        --card: #202020;
        --card-2: #2a2a2a;
        --text: #f4f1ed;
        --muted: #aaa39a;
        --line: rgba(255,255,255,0.14);
        --line-strong: rgba(255,255,255,0.28);
        --accent: #aaa3ff;
        --accent-2: #302c60;
        --accent-3: #e0dcff;
        --ok-bg: #173404;
        --ok-text: #c9ecaa;
        --ng-bg: #4c1113;
        --ng-text: #ffc7c9;
        --hint-bg: #432703;
        --hint-text: #ffd58b;
        --shadow: 0 18px 45px rgba(0,0,0,0.28);
      }
    }
    body {
      min-height: 100vh;
      font-family: var(--font);
      background:
        radial-gradient(circle at top left, rgba(127,119,221,.16), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(42,157,143,.10), transparent 30rem),
        var(--bg);
      color: var(--text);
      padding: 20px 14px 44px;
      display: flex;
      justify-content: center;
    }
    .page { width: min(920px, 100%); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .home-link {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 14px; border: 1px solid var(--line);
      border-radius: 999px; color: var(--text); text-decoration: none;
      background: rgba(255,255,255,.55); backdrop-filter: blur(8px);
      font-size: 14px; box-shadow: 0 8px 22px rgba(30,26,20,.05);
    }
    @media (prefers-color-scheme: dark) { .home-link { background: rgba(32,32,32,.7); } }
    .home-link:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .brand { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
    .hero { margin: 14px 0 18px; }
    .eyebrow { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    h1 { font-size: clamp(28px, 5vw, 46px); line-height: 1.06; letter-spacing: -0.05em; font-weight: 750; }
    .lead { margin-top: 10px; color: var(--muted); font-size: 15px; line-height: 1.8; max-width: 760px; }
    .panel {
      background: color-mix(in srgb, var(--card) 94%, transparent);
      border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 18px;
    }
    .selector { display: grid; gap: 14px; margin-bottom: 16px; }
    .selector-label { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
    .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sel-btn {
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 14px; padding: 11px 10px; cursor: pointer; font-family: var(--font);
      text-align: center; font-size: 14px; line-height: 1.25; transition: .15s ease;
    }
    .sel-btn small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .sel-btn:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .sel-btn.active { background: var(--accent-2); color: var(--accent-3); border-color: color-mix(in srgb, var(--accent) 58%, transparent); font-weight: 700; }
    .course-note {
      background: var(--card-2); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; font-size: 13px; line-height: 1.75; color: var(--muted);
    }
    .progress-bg { height: 8px; background: var(--card-2); border-radius: 999px; border: 1px solid var(--line); overflow: hidden; margin: 16px 0; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7f77dd, #2a9d8f); border-radius: inherit; transition: width .25s ease; }
    .quiz-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); padding: 18px; }
    .q-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .badge { font-size: 12px; color: var(--accent-3); background: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
    .counter { margin-left: auto; color: var(--muted); font-size: 13px; }
    .passage { background: var(--card-2); border-left: 4px solid var(--accent); border-radius: 0 14px 14px 0; padding: 14px 16px; line-height: 1.82; font-size: 15px; margin-bottom: 16px; }
    .kw { text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; font-weight: 700; }
    .q-text { font-size: 16px; line-height: 1.65; font-weight: 700; margin-bottom: 12px; }
    .options { display: grid; gap: 9px; margin-bottom: 14px; }
    .opt-btn { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 13px; padding: 11px 13px; cursor: pointer; font: inherit; font-size: 14px; line-height: 1.55; }
    .opt-btn:hover:not(:disabled) { background: var(--card-2); border-color: var(--line-strong); }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.correct { background: var(--ok-bg); color: var(--ok-text); border-color: color-mix(in srgb, var(--ok-text) 42%, transparent); font-weight: 700; }
    .opt-btn.wrong { background: var(--ng-bg); color: var(--ng-text); border-color: color-mix(in srgb, var(--ng-text) 42%, transparent); }
    .hint-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .hint-btn, .next-btn, .try-btn {
      border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
      cursor: pointer; font: inherit; font-size: 13px; color: var(--text); background: var(--card);
    }
    .hint-btn { color: var(--accent-3); background: var(--accent-2); border-color: color-mix(in srgb, var(--accent) 36%, transparent); }
    .hint-btn:disabled { opacity: .45; cursor: default; }
    .hint-box { background: var(--hint-bg); color: var(--hint-text); border: 1px solid color-mix(in srgb, var(--hint-text) 28%, transparent); border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.7; margin: 10px 0; }
    .hint-box p + p { margin-top: 6px; }
    .feedback { border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.75; margin: 10px 0; }
    .feedback.ok { background: var(--ok-bg); color: var(--ok-text); border: 1px solid color-mix(in srgb, var(--ok-text) 38%, transparent); }
    .feedback.ng { background: var(--ng-bg); color: var(--ng-text); border: 1px solid color-mix(in srgb, var(--ng-text) 38%, transparent); }
    .next-btn, .try-btn { background: var(--text); color: var(--bg); border-color: var(--text); padding: 10px 18px; margin-top: 4px; }
    .next-btn:hover, .try-btn:hover { opacity: .86; }
    .result { text-align: center; padding: 22px 10px; }
    .score { font-size: 46px; font-weight: 800; letter-spacing: -0.04em; color: var(--accent); }
    .score-sub { color: var(--muted); font-size: 14px; margin: 6px 0 16px; }
    .result-msg { line-height: 1.75; margin-bottom: 16px; }
    .mini-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .plain-btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 10px 16px; font: inherit; font-size: 13px; cursor: pointer; }
    footer { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 14px; text-align: center; }
    @media (max-width: 640px) {
      body { padding-top: 14px; }
      .topbar { align-items: flex-start; }
      .brand { display: none; }
      .btn-grid { grid-template-columns: 1fr; }
      .panel, .quiz-card { padding: 14px; }
      .counter { width: 100%; margin-left: 0; }
    }
  </style>
</head>

  <script>
    const BANKS = {"pre2":{"l1":[{"cat":"Science","passage":"When water gets enough heat, it can change into <span class=\"kw\">vapor</span>. This process is called <span class=\"kw\">evaporation</span>. It often happens from the surface of oceans, rivers, and puddles.","q":"What helps evaporation happen faster?","opts":["Lower temperature","More heat","Less surface area","Less air"],"ans":1,"exp":"Heat gives water molecules more energy, so they can leave the liquid surface more easily.","hints":["evaporation は『蒸発』です。","水が気体になるにはエネルギーが必要です。","温度が上がると分子の動きが活発になります。"]},{"cat":"Math","passage":"A <span class=\"kw\">fraction</span> shows part of a whole. The top number is the numerator, and the bottom number is the <span class=\"kw\">denominator</span>. In 3/4, the whole is divided into four equal parts.","q":"What does the denominator show?","opts":["How many parts are chosen","How many equal parts make the whole","The answer to a division problem","The size of one side"],"ans":1,"exp":"The denominator tells how many equal parts the whole is divided into.","hints":["3/4 の下の数に注目。","下の数は『全体の分け方』を表します。","denominator = 分母です。"]},{"cat":"Biology","passage":"A <span class=\"kw\">habitat</span> is the natural home of a living thing. Fish live in water, while many birds live in trees. A good habitat gives animals food, water, and shelter.","q":"What is a habitat?","opts":["A type of weather","An animal's natural home","A tool for measuring heat","A group of stars"],"ans":1,"exp":"A habitat is the place where a plant or animal naturally lives and gets what it needs.","hints":["habitat は生物の生活場所です。","food, water, shelter がヒントです。","『すみか』に近い意味です。"]},{"cat":"Math","passage":"To find the <span class=\"kw\">average</span> of several numbers, add them together and divide by how many numbers there are. For example, the average of 2, 4, and 6 is 4. Averages help us summarize data.","q":"How do you find the average of three numbers?","opts":["Multiply all numbers","Add them and divide by three","Choose the largest number","Subtract the smallest number"],"ans":1,"exp":"For three numbers, add the numbers and divide the total by 3.","hints":["average = 平均です。","まず全部足します。","3個の数なら最後に3で割ります。"]},{"cat":"Physics","passage":"A simple <span class=\"kw\">circuit</span> needs a battery, wires, and a bulb. Electric current can flow only when the path is closed. If the wire is broken, the bulb will not light.","q":"Why will the bulb not light when the wire is broken?","opts":["The battery becomes heavier","The current cannot flow","The bulb changes color","The wire becomes a magnet"],"ans":1,"exp":"Current needs a complete path. A broken wire opens the circuit and stops the current.","hints":["circuit は回路です。","電流は道がつながっていないと流れません。","切れた回路 = open circuit です。"]},{"cat":"Earth Science","passage":"A <span class=\"kw\">cloud</span> is made of many tiny water drops or ice crystals. Warm air rises and cools high in the sky. Then water vapor changes into small drops.","q":"What are clouds mainly made of?","opts":["Tiny water drops or ice crystals","Only smoke","Pieces of metal","Dry sand"],"ans":0,"exp":"Clouds are made when water vapor cools and forms tiny drops or ice crystals.","hints":["cloud は雲です。","water drops は小さな水滴です。","水蒸気が冷えると雲になります。"]},{"cat":"Biology","passage":"Most plants have <span class=\"kw\">roots</span>. Roots take in water from the soil and help hold the plant in place. Some roots also store food.","q":"What do roots help plants do?","opts":["Fly in the air","Take in water","Make thunder","Count stars"],"ans":1,"exp":"Roots absorb water from the soil and support the plant.","hints":["roots = 根。","土の中にあります。","水を吸い上げる部分です。"]},{"cat":"Physics","passage":"A <span class=\"kw\">magnet</span> can pull some metals, such as iron. It has two poles, called north and south. Opposite poles attract each other.","q":"Which material can a magnet often pull?","opts":["Wood","Iron","Paper","Glass"],"ans":1,"exp":"Magnets often attract iron and some other metals.","hints":["magnet = 磁石。","pull は引く。","iron = 鉄です。"]},{"cat":"Chemistry","passage":"Ice, liquid water, and steam are different <span class=\"kw\">states</span> of water. Water can change state when heat is added or removed. The substance is still water.","q":"What can change the state of water?","opts":["Heat being added or removed","Changing its name","Painting it red","Counting it twice"],"ans":0,"exp":"Adding or removing heat can change water between solid, liquid, and gas.","hints":["state = 状態。","氷・水・水蒸気の違いです。","熱がポイントです。"]},{"cat":"Astronomy","passage":"The <span class=\"kw\">moon</span> does not make its own light. We see it because it reflects sunlight. Its shape seems to change during a month.","q":"Why can we see the moon?","opts":["It reflects sunlight","It burns like a candle","It is made of glass","It creates rain"],"ans":0,"exp":"The moon is visible because sunlight reflects from its surface.","hints":["moon = 月。","reflect は反射する。","月は太陽の光を反射しています。"]},{"cat":"Environment","passage":"A <span class=\"kw\">recycle</span> bin is used for materials that can be used again. Paper, cans, and bottles are often recycled. Recycling can reduce waste.","q":"What is one purpose of recycling?","opts":["To reduce waste","To make more smoke","To waste paper","To stop all plants"],"ans":0,"exp":"Recycling helps use materials again and reduce the amount of waste.","hints":["recycle = 再利用する。","waste = ごみ、むだ。","ごみを減らすことが目的です。"]},{"cat":"Health","passage":"Your <span class=\"kw\">pulse</span> is the beat you can feel when your heart pumps blood. It may become faster after running. Doctors can use it to check your condition.","q":"What may happen to your pulse after running?","opts":["It may become faster","It turns into water","It stops gravity","It becomes a bone"],"ans":0,"exp":"Running makes the heart work harder, so the pulse often becomes faster.","hints":["pulse = 脈拍。","走ると心臓が速く動きます。","脈も速くなります。"]},{"cat":"Weather","passage":"<span class=\"kw\">Temperature</span> tells how hot or cold something is. We can measure it with a thermometer. In science, temperature is often written in degrees Celsius.","q":"What does temperature tell us?","opts":["How hot or cold something is","How loud a sound is","How old a book is","How many colors exist"],"ans":0,"exp":"Temperature measures hotness or coldness.","hints":["temperature = 温度。","hot or cold がヒントです。","thermometer は温度計です。"]},{"cat":"Biology","passage":"Animals need <span class=\"kw\">oxygen</span> to live. When we breathe in, oxygen enters our lungs. Our blood carries it around the body.","q":"What carries oxygen around the body?","opts":["Blood","Sand","Clouds","Plastic"],"ans":0,"exp":"Blood carries oxygen from the lungs to the rest of the body.","hints":["oxygen = 酸素。","lungs = 肺。","血液が酸素を運びます。"]},{"cat":"Math in Science","passage":"A <span class=\"kw\">scale</span> can measure mass. If one apple has a mass of 150 grams, two similar apples have a mass of about 300 grams. Scientists often measure carefully.","q":"What does a scale measure in this passage?","opts":["Mass","Color","Sound","Time"],"ans":0,"exp":"The passage says a scale can measure mass.","hints":["scale = はかり。","mass = 質量。","グラムで表す量です。"]}],"l2":[{"cat":"Biology","passage":"Plants make food through <span class=\"kw\">photosynthesis</span>. They use sunlight, water, and carbon dioxide. Oxygen is released as a by-product.","q":"Which gas do plants take in during photosynthesis?","opts":["Oxygen","Carbon dioxide","Hydrogen","Nitrogen"],"ans":1,"exp":"Plants take in carbon dioxide and release oxygen during photosynthesis.","hints":["photosynthesis = 光合成。","植物が材料として使う気体です。","二酸化炭素 = carbon dioxide。"]},{"cat":"Physics","passage":"<span class=\"kw\">Gravity</span> is a force that pulls objects toward each other. On Earth, it pulls objects toward the center of the planet. The strength of gravity depends on mass and distance.","q":"Which two factors affect the strength of gravity?","opts":["Color and shape","Mass and distance","Speed and sound","Temperature and light"],"ans":1,"exp":"Gravity depends mainly on the masses of the objects and the distance between them.","hints":["gravity = 重力。","重い物体ほど強く引きます。","距離が遠いほど引力は弱くなります。"]},{"cat":"Environment","passage":"<span class=\"kw\">Renewable</span> energy comes from sources that can be replaced naturally. Sunlight and wind are examples. Fossil fuels, such as coal and oil, take millions of years to form.","q":"Which source is renewable?","opts":["Coal","Oil","Wind","Natural gas"],"ans":2,"exp":"Wind is renewable because it is naturally available and does not run out in the same way fossil fuels do.","hints":["renewable = 再生可能。","石炭や石油は化石燃料です。","風や太陽光は自然に繰り返し得られます。"]},{"cat":"Math","passage":"Speed tells how far something travels in a certain time. If a train travels 120 kilometers in 2 hours, its <span class=\"kw\">speed</span> is 60 kilometers per hour. The formula is distance divided by time.","q":"How is speed calculated?","opts":["Time divided by distance","Distance divided by time","Distance plus time","Time minus distance"],"ans":1,"exp":"Speed is distance divided by time.","hints":["speed = 速さ。","『道のり ÷ 時間』です。","120 km ÷ 2 h = 60 km/h。"]},{"cat":"Biology","passage":"Most cells are too small to see with only our eyes. A <span class=\"kw\">microscope</span> makes tiny things look larger. Inside many cells, the nucleus controls cell activities.","q":"What does a microscope help us do?","opts":["Hear tiny sounds","See very small things","Make cells disappear","Change sunlight into food"],"ans":1,"exp":"A microscope magnifies tiny objects so we can observe them.","hints":["micro = とても小さい。","scope は見る道具に関係します。","顕微鏡 = microscope。"]},{"cat":"Biology","passage":"An animal has an <span class=\"kw\">adaptation</span> if a body part or behavior helps it survive. A duck has webbed feet that help it swim. A cactus has thick stems that store water.","q":"What is an adaptation?","opts":["A feature that helps survival","A kind of storm","A mistake in counting","A sound made by a machine"],"ans":0,"exp":"An adaptation is a helpful feature or behavior for survival.","hints":["adaptation = 適応。","survive は生き残る。","生き残りに役立つ特徴です。"]},{"cat":"Earth Science","passage":"<span class=\"kw\">Condensation</span> happens when water vapor cools and changes into liquid water. Drops on the outside of a cold glass are an example. This process is part of the water cycle.","q":"What happens during condensation?","opts":["Liquid water changes into rock","Water vapor changes into liquid water","Ice becomes metal","Clouds disappear forever"],"ans":1,"exp":"Condensation is the change from gas to liquid when water vapor cools.","hints":["condensation = 凝結。","water vapor は水蒸気。","気体から液体になります。"]},{"cat":"Physics","passage":"A <span class=\"kw\">force</span> can change the motion of an object. Pushing a cart may make it move faster. Pulling it in the opposite direction may slow it down.","q":"What can a force change?","opts":["An object's motion","The number of months","The color of sunlight","The spelling of a word"],"ans":0,"exp":"A force can speed up, slow down, or change the direction of an object.","hints":["force = 力。","motion = 運動。","押す・引くで動きが変わります。"]},{"cat":"Chemistry","passage":"A <span class=\"kw\">mixture</span> contains two or more substances that are not chemically joined. Salt water is a mixture of salt and water. The parts may be separated by physical methods.","q":"What is salt water an example of?","opts":["A mixture","A planet","A magnet","A bone"],"ans":0,"exp":"Salt water contains salt and water together, so it is a mixture.","hints":["mixture = 混合物。","salt water = 食塩水。","化学的に一体化していない点が大切です。"]},{"cat":"Ecology","passage":"A <span class=\"kw\">food chain</span> shows how energy moves from one living thing to another. Grass is eaten by a rabbit, and the rabbit may be eaten by a fox. Energy begins with plants.","q":"Where does energy usually begin in this food chain?","opts":["With plants","With plastic","With the moon","With a thermometer"],"ans":0,"exp":"Plants capture sunlight and form the first step in many food chains.","hints":["food chain = 食物連鎖。","grass が最初に出ています。","植物が出発点です。"]},{"cat":"Human Body","passage":"The <span class=\"kw\">skeleton</span> supports the body and protects important organs. The skull protects the brain, and the ribs protect the lungs and heart. Bones also help us move.","q":"What does the skull protect?","opts":["The brain","The stomach","The skin","The feet"],"ans":0,"exp":"The skull is the bone structure that protects the brain.","hints":["skeleton = 骨格。","skull = 頭蓋骨。","脳を守ります。"]},{"cat":"Weather","passage":"<span class=\"kw\">Air pressure</span> is the force of air pushing on a surface. Changes in air pressure can affect weather. Low pressure is often connected with clouds or rain.","q":"What can changes in air pressure affect?","opts":["Weather","The alphabet","The size of a triangle only","The taste of sugar"],"ans":0,"exp":"Air pressure changes are important in weather patterns.","hints":["air pressure = 気圧。","weather = 天気。","低気圧と雨の関係を思い出してください。"]},{"cat":"Physics","passage":"Sound travels as a <span class=\"kw\">wave</span>. It needs a material such as air, water, or metal to travel through. In empty space, sound cannot travel.","q":"Why can sound not travel in empty space?","opts":["It needs a material to travel through","It is always too bright","It becomes a plant","It has no color"],"ans":0,"exp":"Sound waves need matter to carry their vibrations.","hints":["wave = 波。","empty space = 真空。","音は空気などの物質を通って伝わります。"]},{"cat":"Science Method","passage":"A scientist makes a <span class=\"kw\">prediction</span> before an experiment. The prediction says what the scientist expects to happen. Results can support or weaken the prediction.","q":"What does a prediction say?","opts":["What is expected to happen","What already happened last year only","How to draw a perfect circle","Why every answer is correct"],"ans":0,"exp":"A prediction states the expected result before testing.","hints":["prediction = 予測。","expect は予想する。","実験前に考える結果です。"]},{"cat":"Environment","passage":"<span class=\"kw\">Pollution</span> can harm air, water, and soil. Factories, cars, and trash can create pollution if not managed well. Reducing pollution helps protect living things.","q":"What can pollution harm?","opts":["Air, water, and soil","Only the calendar","Only numbers","The idea of gravity"],"ans":0,"exp":"Pollution can damage different parts of the environment.","hints":["pollution = 汚染。","air, water, soil に注目。","環境を傷つけるものです。"]}],"l3":[{"cat":"Ecology","passage":"In an <span class=\"kw\">ecosystem</span>, living things depend on one another. If the number of predators falls sharply, the number of prey may increase. This can change the balance of the whole system.","q":"What may happen if predators decrease?","opts":["Prey may increase","All plants disappear immediately","The ecosystem stops changing","Gravity becomes weaker"],"ans":0,"exp":"With fewer predators, more prey can survive, so their population may increase.","hints":["predator = 捕食者。","prey = 食べられる側。","捕食者が減ると、食べられる側はどうなりますか。"]},{"cat":"Physics","passage":"<span class=\"kw\">Insulation</span> slows the movement of heat. A thick coat keeps warm air near your body, and a thermos keeps hot drinks hot. Good insulation reduces heat transfer.","q":"What is the main role of insulation?","opts":["To create electricity","To slow heat transfer","To increase gravity","To turn liquid into solid"],"ans":1,"exp":"Insulation reduces how quickly heat moves from one place to another.","hints":["insulation = 断熱。","熱の移動を考えます。","保温ボトルが冷めにくい理由です。"]},{"cat":"Math","passage":"<span class=\"kw\">Probability</span> describes how likely an event is. If a bag has one red ball and one blue ball, the chance of picking a red ball is one out of two. This can be written as 1/2 or 50%.","q":"What does probability describe?","opts":["How heavy an object is","How likely something is to happen","How bright a light is","How fast sound travels"],"ans":1,"exp":"Probability measures the chance that an event will happen.","hints":["probability = 確率。","likely は『起こりやすい』という意味です。","chance と近い意味です。"]},{"cat":"Earth Science","passage":"<span class=\"kw\">Erosion</span> happens when wind, water, or ice carries away soil and rock. Over a long time, erosion can change the shape of mountains, rivers, and coastlines. Plants can help slow erosion by holding soil in place.","q":"How can plants help reduce erosion?","opts":["By holding soil in place","By making rocks heavier","By stopping all rain","By changing ice into steam"],"ans":0,"exp":"Plant roots help hold soil, so wind and water cannot carry it away as easily.","hints":["erosion = 侵食。","土が流される現象です。","根が土をつかむイメージです。"]},{"cat":"Chemistry","passage":"A <span class=\"kw\">chemical reaction</span> changes substances into new substances. Signs of a reaction may include a color change, gas bubbles, heat, or light. Burning wood is one common example.","q":"Which sign may show that a chemical reaction has happened?","opts":["A new gas appears","The object becomes silent","The object changes its name","Time moves backward"],"ans":0,"exp":"Gas bubbles, heat, light, or a color change can be evidence of a chemical reaction.","hints":["chemical reaction = 化学反応。","反応では新しい物質ができます。","泡・熱・色の変化などがサインです。"]},{"cat":"Biology","passage":"A <span class=\"kw\">cell</span> is the basic unit of living things. Some living things have only one cell, while humans have trillions. Cells carry out many life processes.","q":"What is a cell?","opts":["The basic unit of living things","A kind of cloud","A piece of plastic","A type of light"],"ans":0,"exp":"Cells are the smallest basic units that make up living organisms.","hints":["cell = 細胞。","living things = 生き物。","生物の基本単位です。"]},{"cat":"Chemistry","passage":"A solution has a <span class=\"kw\">solute</span> and a solvent. In sugar water, sugar is the solute because it dissolves. Water is the solvent because it does the dissolving.","q":"In sugar water, what is the solute?","opts":["Sugar","Water","The glass","The spoon"],"ans":0,"exp":"Sugar is the substance dissolved in the water, so it is the solute.","hints":["solute = 溶質。","dissolve = 溶ける。","溶けているものが溶質です。"]},{"cat":"Physics","passage":"<span class=\"kw\">Friction</span> is a force that works against motion when surfaces touch. It can slow a moving object. Rough surfaces usually create more friction than smooth ones.","q":"What does friction often do?","opts":["It works against motion","It creates sunlight","It removes all mass","It changes water into gold"],"ans":0,"exp":"Friction acts between surfaces and usually slows motion.","hints":["friction = 摩擦。","against motion = 運動に逆らう。","ザラザラした面ほど大きくなりやすいです。"]},{"cat":"Earth Science","passage":"A <span class=\"kw\">fossil</span> is the preserved remains or traces of an ancient living thing. Fossils can help scientists learn about past environments. They are often found in layers of rock.","q":"What can fossils help scientists learn about?","opts":["Past environments","Future passwords","The price of pencils","The smell of metal"],"ans":0,"exp":"Fossils provide evidence about organisms and environments from long ago.","hints":["fossil = 化石。","ancient = 古代の。","昔の環境を知る手がかりです。"]},{"cat":"Ecology","passage":"A <span class=\"kw\">population</span> is a group of the same species living in the same area. If food becomes scarce, the population may stop growing. Disease can also affect its size.","q":"What may happen if food becomes scarce?","opts":["The population may stop growing","The sun becomes colder","The species changes into a rock","All diseases disappear"],"ans":0,"exp":"Limited food can limit the number of individuals that survive and reproduce.","hints":["population = 個体群・人口。","scarce = 不足している。","食べ物が足りないと増えにくくなります。"]},{"cat":"Energy","passage":"<span class=\"kw\">Potential energy</span> is stored energy. A book on a high shelf has gravitational potential energy. When it falls, some of that energy changes into motion.","q":"What is potential energy?","opts":["Stored energy","Lost time","A loud sound","A type of shadow"],"ans":0,"exp":"Potential energy is energy stored because of position or condition.","hints":["potential = 潜在的な。","stored = 蓄えられた。","高い場所にある物体のエネルギーです。"]},{"cat":"Astronomy","passage":"Earth <span class=\"kw\">rotates</span> once about every 24 hours. This rotation causes day and night. Earth also revolves around the sun once a year.","q":"What causes day and night?","opts":["Earth's rotation","Earth's color","The ocean's taste","The size of clouds"],"ans":0,"exp":"Day and night occur because Earth rotates on its axis.","hints":["rotate = 自転する。","24 hours がヒントです。","地球の自転で昼夜ができます。"]},{"cat":"Chemistry","passage":"<span class=\"kw\">Density</span> compares mass and volume. A small object can be heavy if it is very dense. Objects with lower density than water may float.","q":"What does density compare?","opts":["Mass and volume","Color and sound","Time and grammar","Rain and wind only"],"ans":0,"exp":"Density is mass divided by volume, so it compares those two quantities.","hints":["density = 密度。","mass = 質量、volume = 体積。","重さと大きさの関係です。"]},{"cat":"Technology","passage":"A <span class=\"kw\">sensor</span> detects information from the environment. A temperature sensor detects heat, and a light sensor detects brightness. Many smartphones contain several sensors.","q":"What does a sensor do?","opts":["Detects information","Writes poems only","Stops all electricity","Turns oxygen into paper"],"ans":0,"exp":"A sensor detects conditions such as heat, light, motion, or pressure.","hints":["sensor = センサー。","detect = 検出する。","周囲の情報を読み取ります。"]},{"cat":"Science Method","passage":"A fair test changes only one <span class=\"kw\">variable</span> at a time. If many things change together, it is hard to know what caused the result. Careful experiments control variables.","q":"Why should a fair test change only one variable?","opts":["To know what caused the result","To make all results random","To avoid measuring anything","To change the calendar"],"ans":0,"exp":"Changing one variable helps identify which factor caused the observed result.","hints":["variable = 変数。","cause = 原因。","一つだけ変えると原因を調べやすいです。"]}]},"grade2":{"l1":[{"cat":"Science","passage":"A <span class=\"kw\">variable</span> is a factor that can change in an experiment. Scientists often change one variable and observe the result. This helps them test a clear cause-and-effect relationship.","q":"Why do scientists often change only one variable?","opts":["To make the result impossible to compare","To test a clear cause-and-effect relationship","To avoid observing the result","To remove all evidence"],"ans":1,"exp":"Changing one variable makes it easier to see whether that factor caused the observed result.","hints":["variable は『変数・変化する要因』です。","一つだけ変えると、原因を考えやすくなります。","cause-and-effect relationship = 因果関係です。"]},{"cat":"Biology","passage":"The human body needs <span class=\"kw\">nutrients</span> such as proteins, minerals, and vitamins. These substances help cells grow, repair damage, and produce energy. A balanced diet provides many kinds of nutrients.","q":"What do nutrients help the body do?","opts":["Grow and repair cells","Stop all digestion","Remove the need for water","Make sunlight disappear"],"ans":0,"exp":"Nutrients support growth, repair, and energy production in the body.","hints":["nutrient = 栄養素。","grow, repair, energy がキーワードです。","身体の細胞の働きを支えるものです。"]},{"cat":"Earth Science","passage":"<span class=\"kw\">Atmosphere</span> means the layer of gases around a planet. Earth's atmosphere contains oxygen, nitrogen, and other gases. It also helps protect living things from harmful radiation.","q":"What is the atmosphere?","opts":["A layer of gases around a planet","A kind of underground rock","A tool for measuring time","A type of ocean current"],"ans":0,"exp":"The atmosphere is the gas layer surrounding a planet.","hints":["atmosphere = 大気。","planet の around に注目です。","地球を包む気体の層です。"]},{"cat":"Math","passage":"A <span class=\"kw\">ratio</span> compares two quantities. If a class has 10 boys and 15 girls, the ratio of boys to girls is 10 to 15. Ratios can often be simplified like fractions.","q":"What does a ratio compare?","opts":["Two quantities","Only temperatures","The age of a star","The spelling of a word"],"ans":0,"exp":"A ratio shows how two amounts are related to each other.","hints":["ratio = 比。","compare = 比較する。","二つの量を比べます。"]},{"cat":"Environment","passage":"Many products create <span class=\"kw\">waste</span> after they are used. Recycling can reduce waste by turning used materials into new products. However, reducing unnecessary consumption is also important.","q":"What can recycling do?","opts":["Increase every kind of waste","Turn used materials into new products","Make consumption unnecessary forever","Stop all production immediately"],"ans":1,"exp":"Recycling reuses materials, so they can become new products instead of simply becoming waste.","hints":["recycling = リサイクル。","used materials に注目です。","使った材料を新しい製品にします。"]},{"cat":"Biology","passage":"<span class=\"kw\">Enzymes</span> are proteins that help chemical reactions happen faster in living things. They are not used up by the reactions. Each enzyme usually works best under certain conditions.","q":"What do enzymes do?","opts":["They help reactions happen faster","They turn all cells into bones","They remove every condition","They stop all life processes"],"ans":0,"exp":"Enzymes speed up biological reactions without being consumed.","hints":["enzyme = 酵素。","reaction を速くするものです。","生物の体内で重要です。"]},{"cat":"Physics","passage":"<span class=\"kw\">Kinetic energy</span> is the energy of motion. A moving bicycle has kinetic energy. If it moves faster, its kinetic energy increases.","q":"What is kinetic energy?","opts":["Energy of motion","Energy stored in food only","A type of weather","A kind of microscope"],"ans":0,"exp":"Kinetic energy is energy an object has because it is moving.","hints":["kinetic = 運動の。","motion = 動き。","速いほど大きくなります。"]},{"cat":"Earth Science","passage":"<span class=\"kw\">Plate tectonics</span> explains how large pieces of Earth’s outer layer move slowly. Their movement can create mountains, earthquakes, and volcanoes. The plates move only a few centimeters each year.","q":"What can plate movement create?","opts":["Mountains and earthquakes","New alphabets","Perfect silence","Longer minutes"],"ans":0,"exp":"Moving plates can form mountains and cause earthquakes or volcanoes.","hints":["plate tectonics = プレートテクトニクス。","earthquake = 地震。","地球の表面の大きな板の動きです。"]},{"cat":"Chemistry","passage":"The <span class=\"kw\">pH</span> scale shows how acidic or basic a solution is. A pH of 7 is neutral. Values below 7 are acidic, and values above 7 are basic.","q":"What does pH show?","opts":["How acidic or basic a solution is","How old a rock is","How fast light travels","How loud music is"],"ans":0,"exp":"pH measures acidity and basicity in solutions.","hints":["acidic = 酸性。","basic = 塩基性・アルカリ性。","pH は酸性・中性・アルカリ性の尺度です。"]},{"cat":"Environment","passage":"<span class=\"kw\">Deforestation</span> means removing many trees from a forest. It can reduce habitats and increase carbon dioxide in the air. Sustainable forestry tries to reduce these harms.","q":"What can deforestation reduce?","opts":["Habitats","Gravity","The number of seasons","The boiling point of water"],"ans":0,"exp":"Removing forests can destroy the places where many organisms live.","hints":["deforestation = 森林破壊。","habitat = すみか。","木がなくなると生物のすみかも減ります。"]},{"cat":"Astronomy","passage":"A <span class=\"kw\">telescope</span> collects light from distant objects. It helps scientists observe stars, planets, and galaxies. Larger telescopes can often detect fainter objects.","q":"What does a telescope collect?","opts":["Light from distant objects","Only sound from the ocean","Soil from farms","Heat from pencils"],"ans":0,"exp":"Telescopes gather light so distant objects can be observed.","hints":["telescope = 望遠鏡。","distant = 遠い。","遠くの天体からの光を集めます。"]},{"cat":"Human Body","passage":"<span class=\"kw\">Digestion</span> breaks food into smaller substances that the body can use. The stomach and intestines play important roles. Enzymes also help break down food molecules.","q":"What is the purpose of digestion?","opts":["To break food into usable substances","To make bones disappear","To stop breathing","To create moonlight"],"ans":0,"exp":"Digestion breaks food down so nutrients can be absorbed and used.","hints":["digestion = 消化。","break down = 分解する。","体が使える形にします。"]},{"cat":"Physics","passage":"Light can be <span class=\"kw\">reflected</span> when it hits a surface. A mirror reflects light very well, which is why we can see images in it. Rough surfaces scatter light in many directions.","q":"Why can we see images in a mirror?","opts":["It reflects light well","It absorbs all light","It makes sound louder","It creates oxygen"],"ans":0,"exp":"A mirror forms images because it reflects light in an organized way.","hints":["reflect = 反射する。","mirror = 鏡。","鏡は光をよく反射します。"]},{"cat":"Ecology","passage":"A <span class=\"kw\">consumer</span> is an organism that gets energy by eating other organisms. Rabbits eat plants, and foxes eat rabbits. Consumers depend directly or indirectly on producers.","q":"How does a consumer get energy?","opts":["By eating other organisms","By becoming sunlight","By freezing water","By measuring time"],"ans":0,"exp":"Consumers obtain energy from food made of other organisms.","hints":["consumer = 消費者。","eat がヒントです。","他の生物を食べてエネルギーを得ます。"]},{"cat":"Science Method","passage":"A <span class=\"kw\">control group</span> is used for comparison in an experiment. It does not receive the treatment being tested. Comparing groups helps researchers judge the effect of the treatment.","q":"Why is a control group used?","opts":["For comparison","To remove all data","To make the treatment invisible","To replace the experiment"],"ans":0,"exp":"A control group provides a baseline for comparing the treated group.","hints":["control group = 対照群。","comparison = 比較。","効果を見るための基準になります。"]}],"l2":[{"cat":"Physics","passage":"An object has <span class=\"kw\">momentum</span> when it is moving. Momentum depends on both mass and velocity. A heavy truck moving fast is harder to stop than a small bicycle moving slowly.","q":"Which two factors does momentum depend on?","opts":["Mass and velocity","Color and sound","Shape and smell","Heat and brightness"],"ans":0,"exp":"Momentum depends on mass and velocity.","hints":["momentum = 運動量。","mass = 質量、velocity = 速度。","重くて速いものほど止まりにくいです。"]},{"cat":"Biology","passage":"<span class=\"kw\">Adaptation</span> is a feature that helps a living thing survive in its environment. Thick fur helps some animals live in cold places. Over many generations, useful traits may become common in a population.","q":"What is an adaptation?","opts":["A feature that helps survival","A sudden change in the weather","A tool used only in laboratories","A rule that prevents reproduction"],"ans":0,"exp":"An adaptation is a trait that improves survival or reproduction in a certain environment.","hints":["adaptation = 適応。","survive が大きなヒントです。","環境に合って生き残りやすくする特徴です。"]},{"cat":"Chemistry","passage":"A solution can be <span class=\"kw\">acidic</span>, neutral, or basic. Lemon juice is acidic, while soap is often basic. The pH scale is used to compare these properties.","q":"What is the pH scale used for?","opts":["Comparing acidity and basicity","Measuring the speed of light","Counting the number of planets","Predicting every chemical reaction"],"ans":0,"exp":"The pH scale indicates how acidic or basic a solution is.","hints":["acidic = 酸性の。basic = 塩基性の。","pH は理科で出る尺度です。","酸性・中性・塩基性を比べます。"]},{"cat":"Data","passage":"A graph can reveal a <span class=\"kw\">trend</span> in data. For example, a line graph may show that average temperature is rising over time. Trends help us see patterns that are hard to notice from single numbers.","q":"Why are trends useful?","opts":["They hide all patterns","They show patterns over time or across data","They remove the need for data","They make every result certain"],"ans":1,"exp":"Trends make larger patterns easier to see.","hints":["trend = 傾向。","single numbers だけでは見えにくいものです。","データ全体の流れを見ます。"]},{"cat":"Technology","passage":"A <span class=\"kw\">sensor</span> detects information from the environment, such as light, heat, or motion. Smartphones use several sensors to respond to users. For example, a phone can rotate its screen when it detects movement.","q":"What does a sensor do?","opts":["It detects information from the environment","It removes all electricity","It writes every program by itself","It stops devices from responding"],"ans":0,"exp":"A sensor collects information such as light, temperature, or motion.","hints":["sensor = センサー。","detect = 検出する。","環境から情報を受け取る部品です。"]},{"cat":"Climate","passage":"<span class=\"kw\">Greenhouse gases</span> absorb some heat that Earth gives off. This natural process keeps the planet warm enough for life. However, extra greenhouse gases can increase global temperatures.","q":"What can extra greenhouse gases do?","opts":["Increase global temperatures","Stop all seasons","Remove the atmosphere","Turn oceans into glass"],"ans":0,"exp":"More greenhouse gases can trap more heat and raise temperatures.","hints":["greenhouse gas = 温室効果ガス。","absorb heat = 熱を吸収する。","増えすぎると温暖化につながります。"]},{"cat":"Biology","passage":"<span class=\"kw\">Genetic variation</span> means differences in genes among individuals. It helps populations adapt when environments change. Without variation, a disease or climate shift could harm many individuals in the same way.","q":"Why is genetic variation useful?","opts":["It helps populations adapt","It makes all individuals identical","It prevents reproduction","It removes environments"],"ans":0,"exp":"Variation provides different traits, some of which may be helpful under new conditions.","hints":["genetic = 遺伝的な。","variation = ばらつき。","環境変化への適応に役立ちます。"]},{"cat":"Chemistry","passage":"A <span class=\"kw\">catalyst</span> increases the rate of a chemical reaction without being used up. Catalysts are important in industry and in living cells. Enzymes are biological catalysts.","q":"What is true of a catalyst?","opts":["It speeds up a reaction without being used up","It always becomes the final product","It stops all reactions","It is only a kind of light"],"ans":0,"exp":"Catalysts speed reactions and remain available after the reaction.","hints":["catalyst = 触媒。","rate = 速度。","反応を速くしても自分は消費されません。"]},{"cat":"Physics","passage":"<span class=\"kw\">Momentum</span> depends on mass and velocity. A heavy truck moving slowly can still have large momentum. Changing momentum requires a force acting over time.","q":"What two factors does momentum depend on?","opts":["Mass and velocity","Color and taste","Age and language","Sound and brightness"],"ans":0,"exp":"Momentum is related to how much mass is moving and how fast it moves.","hints":["momentum = 運動量。","mass = 質量。velocity = 速度。","重くて速いほど大きくなります。"]},{"cat":"Ecology","passage":"<span class=\"kw\">Carrying capacity</span> is the largest population an environment can support over time. It depends on food, water, space, and other resources. If a population grows beyond it, resources may become scarce.","q":"What does carrying capacity describe?","opts":["The largest supportable population","The speed of sound","The mass of a single atom","The shape of a cloud"],"ans":0,"exp":"Carrying capacity is the maximum population size an environment can sustain.","hints":["carrying capacity = 環境収容力。","support over time がヒントです。","環境が支えられる最大数です。"]},{"cat":"Technology","passage":"<span class=\"kw\">Data compression</span> reduces the size of digital information. It can make files faster to send or cheaper to store. Some methods lose information, while others preserve it exactly.","q":"Why is data compression useful?","opts":["It reduces file size","It destroys all computers","It makes every file larger","It replaces electricity"],"ans":0,"exp":"Compression makes digital data smaller, helping storage and transmission.","hints":["compression = 圧縮。","digital information のサイズを小さくします。","保存や送信がしやすくなります。"]},{"cat":"Earth Science","passage":"<span class=\"kw\">Groundwater</span> is water stored under the ground in soil and rock. Many wells draw water from these underground sources. Pollution can make groundwater unsafe to drink.","q":"Where is groundwater stored?","opts":["Under the ground","Only in clouds","Inside stars","On the surface of the moon"],"ans":0,"exp":"Groundwater is stored beneath the surface in spaces within soil and rock.","hints":["groundwater = 地下水。","under the ground がヒントです。","井戸の水源になることがあります。"]},{"cat":"Health Science","passage":"<span class=\"kw\">Immunity</span> is the body’s ability to defend itself against disease. Vaccines can train the immune system to recognize a pathogen. This can reduce the chance of severe illness.","q":"What can vaccines help the immune system do?","opts":["Recognize a pathogen","Forget every disease","Stop producing cells","Change bones into water"],"ans":0,"exp":"Vaccines prepare the immune system to recognize and respond to specific pathogens.","hints":["immunity = 免疫。","pathogen = 病原体。","ワクチンは免疫系に相手を覚えさせます。"]},{"cat":"Statistics","passage":"A <span class=\"kw\">sample</span> is a smaller group selected from a larger population. Researchers study samples because studying everyone is often impossible. A sample should represent the population well.","q":"Why do researchers use samples?","opts":["Studying everyone is often impossible","Samples never need data","Populations are always tiny","Samples remove uncertainty completely"],"ans":0,"exp":"Samples allow researchers to estimate patterns in a larger population.","hints":["sample = 標本。","population = 母集団。","全員を調べるのが難しいときに使います。"]},{"cat":"Astronomy","passage":"A star’s <span class=\"kw\">brightness</span> as seen from Earth depends on both its actual light output and its distance. A very bright star may look dim if it is far away. Distance matters greatly in astronomy.","q":"Why might a very bright star look dim?","opts":["It may be very far away","It has no light output","It is made of paper","It is inside a classroom"],"ans":0,"exp":"Apparent brightness decreases with distance.","hints":["brightness = 明るさ。","dim = 暗く見える。","遠いと明るい星でも暗く見えます。"]}],"l3":[{"cat":"Science","passage":"A scientific explanation becomes stronger when it is supported by <span class=\"kw\">evidence</span> from repeated observations. One unusual result may be important, but it should be checked carefully. Reliable conclusions usually require more than a single example.","q":"Why are repeated observations important?","opts":["They make evidence more reliable","They prevent all new questions","They prove every claim immediately","They replace the need for experiments"],"ans":0,"exp":"Repeated observations reduce the chance that a conclusion is based on accident or error.","hints":["evidence = 証拠。","repeated observations = 繰り返し観察。","一回だけだと偶然や誤差かもしれません。"]},{"cat":"Environment","passage":"<span class=\"kw\">Biodiversity</span> means the variety of living things in an area. Ecosystems with greater biodiversity can often recover better after stress. If many species disappear, the system may become less stable.","q":"What can high biodiversity help an ecosystem do?","opts":["Recover better after stress","Lose every species at once","Stop all environmental change","Avoid the need for sunlight"],"ans":0,"exp":"Greater variety can make an ecosystem more stable and resilient.","hints":["biodiversity = 生物多様性。","variety が中心です。","種類が多いと、変化への耐性が上がることがあります。"]},{"cat":"Health Science","passage":"Sleep affects <span class=\"kw\">concentration</span>, memory, and mood. Students who sleep too little may understand lessons more slowly. Good sleep is therefore not just rest; it supports learning.","q":"According to the passage, what does sleep support?","opts":["Learning and concentration","Only muscle size","The disappearance of memory","The need to study less forever"],"ans":0,"exp":"Sleep supports concentration, memory, mood, and learning.","hints":["concentration = 集中力。","memory, mood, learning に注目です。","睡眠は学習にも関係します。"]},{"cat":"Physics","passage":"Energy can be <span class=\"kw\">transferred</span> from one object to another. When a moving ball hits a still ball, some energy moves to the second ball. This idea helps explain many everyday events.","q":"What does transferred mean in this passage?","opts":["Moved from one object to another","Destroyed completely","Changed into a word","Hidden from observation"],"ans":0,"exp":"Transferred means moved or passed from one object to another.","hints":["transfer = 移す・移動させる。","one object to another がヒントです。","エネルギーが別の物体へ渡ります。"]},{"cat":"Logic","passage":"A conclusion should follow from the <span class=\"kw\">premises</span> of an argument. If the premises are true but the conclusion does not follow, the reasoning is weak. Good reasoning connects evidence and conclusion clearly.","q":"What are premises used for?","opts":["Supporting a conclusion","Replacing all evidence","Making an argument longer without meaning","Avoiding any logical connection"],"ans":0,"exp":"Premises are statements or reasons that support a conclusion.","hints":["premise = 前提。","conclusion = 結論。","前提が結論を支える構造です。"]},{"cat":"Biology","passage":"<span class=\"kw\">Homeostasis</span> is the regulation of internal conditions in living organisms. For example, humans keep body temperature within a narrow range. Sweating helps cool the body when it becomes too warm.","q":"What is homeostasis?","opts":["Regulation of internal conditions","Random change without control","A type of fossil","The study of stars only"],"ans":0,"exp":"Homeostasis keeps internal conditions stable enough for life processes.","hints":["homeostasis = 恒常性。","internal conditions = 体内環境。","体温調節が例です。"]},{"cat":"Chemistry","passage":"<span class=\"kw\">Concentration</span> tells how much solute is dissolved in a certain amount of solution. A salty soup has a higher salt concentration than plain water. Concentration can affect reaction rates.","q":"What does concentration describe?","opts":["How much solute is in a solution","How old a solution is","How loud a liquid is","How many planets exist"],"ans":0,"exp":"Concentration measures the amount of dissolved substance in a given solution.","hints":["concentration = 濃度。","solute = 溶質。","溶液中にどれだけ溶けているかです。"]},{"cat":"Physics","passage":"<span class=\"kw\">Conservation of energy</span> means energy cannot be created or destroyed in an isolated system. It can only change from one form to another. For example, electrical energy can become light and heat.","q":"What does conservation of energy mean?","opts":["Energy changes form but is not created or destroyed","Energy always disappears","Heat is not energy","Light cannot be produced"],"ans":0,"exp":"The total energy remains constant while energy changes form.","hints":["conservation = 保存。","created or destroyed に注目。","エネルギーは形を変えます。"]},{"cat":"Ecology","passage":"<span class=\"kw\">Bioaccumulation</span> occurs when harmful substances build up in an organism over time. Predators may receive higher amounts by eating contaminated prey. This can threaten animals at the top of a food chain.","q":"Why can predators be at risk from bioaccumulation?","opts":["They may eat contaminated prey","They never eat anything","They are always plants","They cannot store substances"],"ans":0,"exp":"Predators can accumulate pollutants from the organisms they consume.","hints":["bioaccumulation = 生物濃縮・蓄積。","contaminated = 汚染された。","食物連鎖の上位ほど危険になることがあります。"]},{"cat":"Geology","passage":"A <span class=\"kw\">sedimentary rock</span> forms when small pieces of material are pressed together over time. These rocks may contain fossils. Layers can record changes in past environments.","q":"Why are sedimentary rocks useful to scientists?","opts":["They may record past environments","They are always made of pure gold","They prevent all erosion","They create electricity by themselves"],"ans":0,"exp":"Their layers and fossils can preserve evidence of the past.","hints":["sedimentary rock = 堆積岩。","layers = 層。","過去の環境の記録になります。"]},{"cat":"Technology","passage":"<span class=\"kw\">Machine learning</span> systems find patterns in data. Their performance depends strongly on the quality and range of training examples. Poor data can lead to poor predictions.","q":"What does machine learning performance depend on?","opts":["The quality and range of training examples","Only the color of the computer","The size of the keyboard","Whether data is avoided"],"ans":0,"exp":"Good, representative training data is crucial for useful predictions.","hints":["machine learning = 機械学習。","training examples = 学習例。","データの質が結果を左右します。"]},{"cat":"Statistics","passage":"<span class=\"kw\">Averages</span> can hide important differences. Two classes may have the same average score, but one class may have scores close together while the other has scores spread widely. Looking only at the average can be misleading.","q":"Why can averages be misleading?","opts":["They can hide variation","They always show every detail","They remove all data","They are never numbers"],"ans":0,"exp":"An average summarizes data but may not show how spread out the values are.","hints":["average = 平均。","variation = ばらつき。","平均だけでは分布が見えません。"]},{"cat":"Climate","passage":"<span class=\"kw\">Carbon sinks</span> absorb more carbon than they release. Forests and oceans can act as carbon sinks. Protecting them can help slow the increase of carbon dioxide in the atmosphere.","q":"What do carbon sinks do?","opts":["Absorb more carbon than they release","Create all carbon dioxide","Remove oxygen from every cell","Stop photosynthesis completely"],"ans":0,"exp":"A carbon sink takes in more carbon than it gives out.","hints":["sink = 吸収源。","carbon = 炭素。","森林や海が例です。"]},{"cat":"Neuroscience","passage":"<span class=\"kw\">Neurons</span> communicate through electrical and chemical signals. Networks of neurons allow the brain to process information. Learning can change the strength of connections between neurons.","q":"What can learning change?","opts":["The strength of connections between neurons","The number of planets","The boiling point of water","The alphabet used in every country"],"ans":0,"exp":"Learning can strengthen or weaken neural connections.","hints":["neuron = 神経細胞。","connection = つながり。","学習で神経の結びつきが変わることがあります。"]},{"cat":"Engineering","passage":"An <span class=\"kw\">efficient</span> machine uses less energy to do the same work. Improving efficiency can reduce cost and waste. However, no real machine is perfectly efficient.","q":"What does an efficient machine do?","opts":["Uses less energy for the same work","Uses infinite energy","Produces no work","Breaks every law of physics"],"ans":0,"exp":"Efficiency means getting useful work with less wasted energy.","hints":["efficient = 効率がよい。","less energy がヒントです。","同じ仕事をより少ないエネルギーで行います。"]}]},"pre1":{"l1":[{"cat":"Biology","passage":"When bacteria are exposed to antibiotics too often, some may survive and reproduce. Over time, a population can become <span class=\"kw\">resistant</span>. This makes infections harder to treat.","q":"What does antibiotic resistance make harder?","opts":["Growing plants","Treating infections","Measuring distance","Producing oxygen"],"ans":1,"exp":"Resistant bacteria are not easily killed by antibiotics, so infections become harder to treat.","hints":["resistant = 抵抗力がある。","antibiotics は抗生物質です。","薬が効きにくくなる問題です。"]},{"cat":"Science","passage":"A <span class=\"kw\">correlation</span> means that two things tend to change together. However, correlation does not always prove <span class=\"kw\">causation</span>. A third factor may be responsible for both changes.","q":"What does the passage warn us about?","opts":["All numbers are useless","Correlation always proves causation","Two related changes may not have a cause-and-effect relationship","A third factor can never matter"],"ans":2,"exp":"The passage explains that two things can be related without one directly causing the other.","hints":["correlation = 相関。","causation = 因果関係。","『一緒に変化する』ことと『原因である』ことは別です。"]},{"cat":"Environment","passage":"Cities often become warmer than nearby rural areas. This <span class=\"kw\">urban heat island</span> effect is caused by roads, buildings, and reduced vegetation. Planting trees can help lower temperatures.","q":"What can help reduce the urban heat island effect?","opts":["Removing all shade","Planting more trees","Using only dark roofs","Covering rivers with concrete"],"ans":1,"exp":"Trees provide shade and release water vapor, which can help cool urban areas.","hints":["urban = 都市の。","heat island = ヒートアイランド。","木や緑は温度を下げる助けになります。"]},{"cat":"Technology","passage":"Solar and wind power can reduce carbon emissions, but their output is <span class=\"kw\">intermittent</span>. They depend on sunlight and wind conditions. Energy storage can help make the supply more stable.","q":"Why can solar and wind power be intermittent?","opts":["They depend on weather conditions","They always produce too much energy","They require no equipment","They work only underground"],"ans":0,"exp":"Their output changes with sunlight and wind, so it is not constant.","hints":["intermittent = 断続的な。","太陽光は夜に弱くなります。","風力は風がないと発電しにくいです。"]},{"cat":"Psychology","passage":"<span class=\"kw\">Cognitive load</span> is the amount of mental effort needed to learn or solve a problem. If instructions are confusing, learners may spend too much effort understanding the task itself. Clear examples can reduce this load.","q":"What can reduce cognitive load?","opts":["Confusing instructions","Clear examples","Longer passwords","Louder music"],"ans":1,"exp":"Clear examples make the task easier to understand and reduce unnecessary mental effort.","hints":["cognitive = 認知の、頭の働きの。","load = 負荷。","わかりやすい例は負担を減らします。"]},{"cat":"Biology","passage":"<span class=\"kw\">Biodiversity loss</span> can reduce the stability of ecosystems. When many species disappear, fewer organisms remain to perform important roles. Recovery from disturbance may become harder.","q":"Why can biodiversity loss reduce stability?","opts":["Fewer species remain to perform important roles","Every organism becomes stronger","Disturbances disappear","Food chains become unnecessary"],"ans":0,"exp":"With fewer species, ecosystems have less functional backup after disturbance.","hints":["biodiversity loss = 生物多様性の喪失。","stability = 安定性。","役割を担う種が減ると不安定になります。"]},{"cat":"Climate","passage":"<span class=\"kw\">Adaptation strategies</span> help societies reduce damage from climate impacts. Examples include sea walls, heat warnings, and drought-resistant crops. These strategies do not eliminate the causes of climate change.","q":"What is the main purpose of adaptation strategies?","opts":["To reduce damage from impacts","To remove the sun","To stop all weather","To prove emissions are harmless"],"ans":0,"exp":"Adaptation prepares for and reduces harm from climate effects.","hints":["adaptation = 適応。","damage = 被害。","原因を減らす mitigation とは別です。"]},{"cat":"Technology","passage":"<span class=\"kw\">Automation</span> can replace routine tasks, but it can also create demand for new skills. Workers may need to learn how to manage, monitor, or improve automated systems. The effect is not simply job loss.","q":"What does the passage suggest about automation?","opts":["It can create demand for new skills","It only affects weather","It makes learning unnecessary","It removes all human work instantly"],"ans":0,"exp":"Automation changes the kinds of skills that may be valuable.","hints":["automation = 自動化。","routine tasks = 定型作業。","新しい技能が必要になることがあります。"]},{"cat":"Medicine","passage":"A <span class=\"kw\">clinical trial</span> tests a medical treatment in people. Researchers compare results to judge safety and effectiveness. Ethical rules are necessary because participants may face risks.","q":"Why are ethical rules needed in clinical trials?","opts":["Participants may face risks","Treatments are never tested","Data is always perfect","Doctors avoid comparison"],"ans":0,"exp":"Ethical rules protect people who take part in medical research.","hints":["clinical trial = 臨床試験。","participant = 参加者。","人を対象にするので倫理が重要です。"]},{"cat":"Statistics","passage":"<span class=\"kw\">Sampling bias</span> occurs when a sample does not represent the population well. For example, a survey of only one neighborhood may not represent an entire city. Biased samples can lead to misleading conclusions.","q":"What can sampling bias cause?","opts":["Misleading conclusions","Perfect representation","No need for data","The end of uncertainty"],"ans":0,"exp":"A biased sample can give results that do not reflect the wider population.","hints":["sampling bias = 標本抽出の偏り。","represent = 代表する。","偏った標本は結論を誤らせます。"]},{"cat":"Physics","passage":"<span class=\"kw\">Radiation</span> transfers energy through waves or particles. Sunlight warms Earth by radiation through space. Unlike sound, radiation does not always need air or another material to travel.","q":"How does sunlight warm Earth through space?","opts":["By radiation","By sound waves only","By flowing through wires","By turning into soil"],"ans":0,"exp":"Sunlight transfers energy through radiation, which can travel through space.","hints":["radiation = 放射。","space = 宇宙空間。","太陽光は放射でエネルギーを運びます。"]},{"cat":"Ecology","passage":"A <span class=\"kw\">keystone species</span> has an unusually large effect on its ecosystem. If it disappears, many other species may be affected. Sea otters, for example, can influence kelp forest ecosystems.","q":"What is special about a keystone species?","opts":["It has a large effect on its ecosystem","It is always the largest animal","It never interacts with others","It lives only in deserts"],"ans":0,"exp":"Keystone species strongly influence ecological structure compared with their abundance.","hints":["keystone species = キーストーン種。","large effect がヒントです。","いなくなると生態系全体に影響します。"]},{"cat":"Chemistry","passage":"<span class=\"kw\">Oxidation</span> can occur when a substance reacts with oxygen or loses electrons. Rusting iron is a familiar example. Preventing oxidation is important in protecting metals.","q":"What is a familiar example of oxidation?","opts":["Rusting iron","Boiling pure water only","Drawing a triangle","Measuring a shadow"],"ans":0,"exp":"Rust forms when iron undergoes oxidation.","hints":["oxidation = 酸化。","rust = さび。","鉄がさびるのが例です。"]},{"cat":"Astronomy","passage":"<span class=\"kw\">Exoplanets</span> are planets outside our solar system. Scientists often detect them indirectly by observing changes in the light from a star. These methods have revealed thousands of distant worlds.","q":"What are exoplanets?","opts":["Planets outside our solar system","Moons inside Earth","Clouds made of iron","Stars without light"],"ans":0,"exp":"Exoplanets orbit stars beyond our solar system.","hints":["exo- は『外の』という意味。","solar system = 太陽系。","太陽系外惑星です。"]},{"cat":"Cognitive Science","passage":"<span class=\"kw\">Attention</span> is limited. When people try to do several difficult tasks at once, performance often declines. Designing learning materials requires care about this limitation.","q":"Why can multitasking reduce performance?","opts":["Attention is limited","The brain has no memory","Tasks become easier automatically","All learning materials disappear"],"ans":0,"exp":"Because attention is limited, dividing it among difficult tasks can reduce performance.","hints":["attention = 注意。","limited = 限られている。","難しい作業を同時にすると集中が分散します。"]}],"l2":[{"cat":"Academic Skills","passage":"<span class=\"kw\">Peer review</span> is a process in which experts evaluate a study before publication. They check whether the methods are sound and whether the conclusions are supported by evidence. It does not guarantee perfection, but it improves reliability.","q":"What is one purpose of peer review?","opts":["To remove all difficult words","To check the quality of a study","To make every paper famous","To replace experiments with opinions"],"ans":1,"exp":"Peer review helps evaluate whether a study is methodologically and logically reliable.","hints":["peer = 同じ分野の専門家。","review = 評価・査読。","研究の質を確認する仕組みです。"]},{"cat":"Ecology","passage":"<span class=\"kw\">Biodiversity</span> refers to the variety of living things in an area. High biodiversity can make ecosystems more resilient. If one species declines, others may still perform similar roles.","q":"Why can biodiversity make ecosystems more resilient?","opts":["Every species becomes identical","Other species may fill similar roles","No species ever dies","Weather stops changing"],"ans":1,"exp":"Variety provides backup functions, so ecosystems may continue working even if one species declines.","hints":["biodiversity = 生物多様性。","resilient = 回復力がある。","似た役割をもつ種が残ることがあります。"]},{"cat":"Technology","passage":"An algorithm can produce unfair results if the data used to train it contains <span class=\"kw\">bias</span>. For example, a system may perform poorly for groups that were underrepresented in the data. Careful testing is therefore necessary.","q":"Why should algorithms be carefully tested?","opts":["They never make mistakes","Training data may contain bias","They cannot use numbers","Testing removes all computers"],"ans":1,"exp":"Biased or incomplete data can lead algorithms to make unfair or inaccurate decisions.","hints":["bias = 偏り。","データが偏ると結果も偏ります。","underrepresented は『十分に含まれていない』という意味です。"]},{"cat":"Climate","passage":"Some climate processes create <span class=\"kw\">feedback loops</span>. For instance, melting ice reduces the amount of sunlight reflected back into space. Darker ocean water then absorbs more heat, causing further melting.","q":"What happens when ice melts in the example?","opts":["More sunlight is reflected","Darker water absorbs more heat","The ocean becomes solid","The atmosphere disappears"],"ans":1,"exp":"Less ice means less reflection; darker water absorbs more heat and can cause more melting.","hints":["feedback loop = フィードバック循環。","氷は太陽光を反射しやすいです。","黒っぽい海水は熱を吸収しやすいです。"]},{"cat":"Economics","passage":"Every decision has an <span class=\"kw\">opportunity cost</span>. If a student spends two hours watching a movie, those hours cannot be used for studying or sleeping. The cost is the value of the best alternative given up.","q":"What is opportunity cost?","opts":["The money paid for every choice","The value of the best alternative given up","A tax on schoolwork","A way to remove all choices"],"ans":1,"exp":"Opportunity cost is what you give up when you choose one option instead of another.","hints":["opportunity = 機会。","cost はお金だけではありません。","選ばなかった最良の選択肢の価値です。"]},{"cat":"Research Methods","passage":"<span class=\"kw\">Replication</span> means repeating a study to see whether similar results appear again. It is important because a single study may be affected by chance, error, or hidden assumptions. Replication strengthens confidence in findings.","q":"Why is replication important?","opts":["It strengthens confidence in findings","It prevents all future studies","It replaces evidence with opinion","It makes chance impossible"],"ans":0,"exp":"Repeated results make a finding more reliable.","hints":["replication = 再現・追試。","single study だけでは不確実です。","同じ結果が繰り返されると信頼性が上がります。"]},{"cat":"Climate Policy","passage":"<span class=\"kw\">Carbon pricing</span> makes emitting carbon dioxide more expensive. The goal is to encourage companies and consumers to choose lower-emission options. Its design affects fairness and effectiveness.","q":"What is the goal of carbon pricing?","opts":["To encourage lower-emission choices","To make emissions free","To ban all prices","To remove economic incentives"],"ans":0,"exp":"Carbon pricing uses economic incentives to reduce emissions.","hints":["carbon pricing = 炭素価格付け。","emission = 排出。","排出にコストをかけて低排出へ誘導します。"]},{"cat":"Biology","passage":"<span class=\"kw\">Epigenetic</span> changes can affect gene activity without changing the DNA sequence itself. Environmental factors may influence these changes. They help explain why genes and environment interact in complex ways.","q":"What do epigenetic changes affect?","opts":["Gene activity","The DNA sequence in every case","The number of planets","The speed of sound"],"ans":0,"exp":"Epigenetic changes influence whether and how strongly genes are active.","hints":["epigenetic = エピジェネティックな。","gene activity = 遺伝子の働き。","DNA配列そのものを変えずに働き方が変わります。"]},{"cat":"Systems","passage":"<span class=\"kw\">Feedback mechanisms</span> occur when the output of a system influences its future behavior. Negative feedback can stabilize a system, while positive feedback can amplify change. Many biological and climate systems include feedback.","q":"What can negative feedback do?","opts":["Stabilize a system","Amplify every change","Remove all outputs","Stop cause and effect"],"ans":0,"exp":"Negative feedback tends to counteract changes and promote stability.","hints":["feedback = フィードバック。","negative は変化を打ち消す方向。","安定化に働くことがあります。"]},{"cat":"Economics of Science","passage":"<span class=\"kw\">Public goods</span> are difficult to exclude people from using, and one person’s use does not greatly reduce another’s. Basic scientific knowledge often has this character. Markets may underprovide such goods without public support.","q":"Why might markets underprovide public goods?","opts":["People can benefit without paying directly","They are always private property","Use by one person destroys them","They have no social value"],"ans":0,"exp":"Because benefits are widely shared, private incentives may be too weak.","hints":["public goods = 公共財。","exclude = 排除する。","ただ乗り問題が起こりやすいです。"]},{"cat":"Technology","passage":"<span class=\"kw\">Cybersecurity</span> protects digital systems from unauthorized access or damage. Strong passwords, updates, and encryption can reduce risk. Human mistakes can still create vulnerabilities.","q":"What can reduce cybersecurity risk?","opts":["Strong passwords and updates","Sharing every password","Ignoring all warnings","Removing encryption"],"ans":0,"exp":"Security practices such as strong passwords and updates help protect systems.","hints":["cybersecurity = サイバーセキュリティ。","unauthorized = 許可されていない。","強いパスワードや更新が重要です。"]},{"cat":"Neuroscience","passage":"<span class=\"kw\">Plasticity</span> is the brain’s ability to change in response to experience. Practice can strengthen certain neural pathways. This is one reason learning is possible throughout life.","q":"What does brain plasticity allow?","opts":["Change in response to experience","The brain to become fixed forever","All memories to vanish instantly","Experience to have no effect"],"ans":0,"exp":"Plasticity allows the nervous system to adapt through experience and practice.","hints":["plasticity = 可塑性。","experience = 経験。","経験に応じて脳が変わる性質です。"]},{"cat":"Environmental Science","passage":"<span class=\"kw\">Eutrophication</span> occurs when excess nutrients enter water and cause rapid algae growth. When algae die and decompose, oxygen in the water can decrease. Fish and other organisms may suffer.","q":"What can eutrophication reduce in water?","opts":["Oxygen","All nutrients instantly","The existence of algae","The length of rivers"],"ans":0,"exp":"Decomposing algae can use up oxygen, harming aquatic life.","hints":["eutrophication = 富栄養化。","algae = 藻類。","酸素不足を引き起こすことがあります。"]},{"cat":"Physics","passage":"<span class=\"kw\">Entropy</span> is often associated with the number of possible arrangements in a system. In many natural processes, total entropy tends to increase. This idea is central to thermodynamics.","q":"Which field is entropy central to?","opts":["Thermodynamics","Spelling practice","Ancient poetry only","Map coloring only"],"ans":0,"exp":"Entropy is a key concept in thermodynamics.","hints":["entropy = エントロピー。","thermodynamics = 熱力学。","自然過程の向きと関係します。"]},{"cat":"Science Communication","passage":"<span class=\"kw\">Risk perception</span> is how people judge the seriousness or likelihood of danger. It is influenced not only by statistics but also by trust, familiarity, and emotion. Communicating risk therefore requires more than numbers.","q":"What influences risk perception besides statistics?","opts":["Trust, familiarity, and emotion","Only the alphabet","The color of paper alone","Nothing at all"],"ans":0,"exp":"People interpret risk through social and psychological factors as well as data.","hints":["risk perception = リスク認知。","trust = 信頼。","数字だけでは人の判断は決まりません。"]}],"l3":[{"cat":"Statistics","passage":"A result may be called <span class=\"kw\">statistically significant</span> when it is unlikely to have occurred by chance under a specific model. However, significance does not necessarily mean the effect is large or practically important.","q":"What does the passage emphasize?","opts":["Significance always means a large effect","Significance and practical importance are not the same","Chance is impossible in research","Models are never used"],"ans":1,"exp":"A statistically significant result can still have a small real-world effect.","hints":["statistically significant = 統計的に有意。","有意でも効果が大きいとは限りません。","practically important は実用上重要という意味です。"]},{"cat":"Biology","passage":"<span class=\"kw\">Gene expression</span> is the process by which information in a gene is used to make a functional product, often a protein. Environmental conditions can influence which genes are active. Thus, having a gene does not always mean it is being expressed.","q":"What does gene expression involve?","opts":["Using genetic information to make a product","Deleting all proteins","Turning every cell into water","Measuring the speed of light"],"ans":0,"exp":"Gene expression uses information in DNA to produce RNA or proteins.","hints":["gene = 遺伝子。","expression は『発現』です。","遺伝情報が実際に使われる過程です。"]},{"cat":"Policy","passage":"Public policy often involves <span class=\"kw\">trade-offs</span>. A rule that increases safety may also raise costs or reduce convenience. Policymakers must decide which benefits and burdens are acceptable.","q":"What is a trade-off?","opts":["A situation with no disadvantages","A balance between benefits and costs","A scientific instrument","A type of chemical bond"],"ans":1,"exp":"A trade-off means gaining something while giving up or reducing something else.","hints":["trade-off = トレードオフ。","安全を高めると費用が増える、など。","良い面と悪い面のバランスです。"]},{"cat":"Ecology","passage":"An <span class=\"kw\">invasive species</span> is introduced into a new environment and spreads in ways that harm native species. It may have few natural predators in the new area. As a result, it can disrupt the local ecosystem.","q":"Why can an invasive species spread rapidly?","opts":["It may have few natural predators","It never reproduces","It always helps native species","It cannot survive outside cities"],"ans":0,"exp":"Without natural predators, an invasive species may reproduce and spread quickly.","hints":["invasive = 侵入性の。","native species = 在来種。","天敵が少ないと増えやすいです。"]},{"cat":"Security","passage":"<span class=\"kw\">Encryption</span> protects information by turning readable data into a coded form. Only someone with the right key can restore the original message. This is important for online banking and private communication.","q":"What is the purpose of encryption?","opts":["To make data publicly readable","To protect information by coding it","To remove all passwords","To slow down electricity"],"ans":1,"exp":"Encryption makes information unreadable to unauthorized people unless they have the correct key.","hints":["encryption = 暗号化。","readable data が coded form になります。","鍵を持つ人だけ元に戻せます。"]},{"cat":"Philosophy of Science","passage":"<span class=\"kw\">Underdetermination</span> occurs when available evidence is compatible with more than one theory. Scientists then consider simplicity, coherence, and future predictive power. Evidence is essential, but interpretation can remain difficult.","q":"What does underdetermination mean?","opts":["Evidence may fit multiple theories","Evidence is never used","Only one theory can exist","Prediction is impossible in science"],"ans":0,"exp":"Underdetermination means the same evidence may not uniquely determine a theory.","hints":["underdetermination = 決定不全。","compatible with more than one theory が重要です。","証拠だけで一つに決まらない場合です。"]},{"cat":"Statistics","passage":"<span class=\"kw\">Confounding variables</span> can make a relationship between two factors appear stronger, weaker, or different from what it really is. Careful study design tries to account for them. Otherwise, conclusions about cause may be unreliable.","q":"Why are confounding variables a problem?","opts":["They can distort conclusions about relationships","They remove every relationship","They make data unnecessary","They guarantee causation"],"ans":0,"exp":"A confounder can influence both the supposed cause and effect, misleading interpretation.","hints":["confounding variable = 交絡変数。","distort = 歪める。","因果関係の判断を難しくします。"]},{"cat":"Climate Systems","passage":"<span class=\"kw\">Tipping points</span> are thresholds beyond which a system may shift rapidly into a different state. Some climate components may change abruptly after gradual pressure. This possibility makes prevention especially important.","q":"What is a tipping point?","opts":["A threshold after which rapid change may occur","A guarantee of slow recovery","A measurement of vocabulary","A kind of harmless cloud"],"ans":0,"exp":"A tipping point is a critical threshold that can trigger major system change.","hints":["threshold = しきい値。","rapid change = 急激な変化。","少し超えると大きく変わる境目です。"]},{"cat":"Bioethics","passage":"<span class=\"kw\">Informed consent</span> requires that participants understand relevant risks and a
