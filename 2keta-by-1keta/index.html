<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2けた×1けた かけ算トレーニング</title>
  <style>
    :root {
      --bg: #fffdf7;
      --paper: #ffffff;
      --ink: #2f2a24;
      --muted: #7b7167;
      --line: #efe3d4;
      --main: #ff9f68;
      --main-dark: #e87637;
      --soft: #fff1df;
      --green: #8cc9a7;
      --blue: #80b6e8;
      --red: #ef7b7b;
      --yellow: #ffe28a;
      --shadow: 0 14px 34px rgba(90, 70, 45, 0.12);
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 226, 138, 0.45), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(128, 182, 232, 0.22), transparent 32rem),
        var(--bg);
      min-height: 100vh;
      touch-action: manipulation;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a.button-link {
      border: 0;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:active,
    a.button-link:active {
      transform: translateY(1px) scale(0.99);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .app {
      width: min(760px, calc(100% - 22px));
      margin: 0 auto;
      padding: 14px 0 28px;
    }

    .top-nav {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 10px;
    }

    .back-btn {
      background: #ffffff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 15px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(90, 70, 45, 0.10);
      font-size: 0.95rem;
    }

    header {
      margin-bottom: 12px;
    }

    .title-block {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(239, 227, 212, 0.8);
      border-radius: var(--radius);
      padding: 15px 17px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 2.15rem);
      letter-spacing: 0.04em;
      line-height: 1.15;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.94rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(239, 227, 212, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .status-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-pill,
    .timer-pill {
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 950;
      border: 1px solid var(--line);
      background: #fff8ef;
      white-space: nowrap;
    }

    .progress-pill {
      font-size: 1.05rem;
      color: #a94a17;
    }

    .timer-pill {
      color: var(--ink);
      background: #ffffff;
      min-width: 112px;
      text-align: center;
    }

    .problem-area {
      position: relative;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(255, 248, 239, 0.92), rgba(255, 255, 255, 0.9));
      border: 2px dashed #ead9c6;
      border-radius: 30px;
      padding: 18px;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      background:
        radial-gradient(circle at 20% 24%, var(--yellow) 0 7px, transparent 8px),
        radial-gradient(circle at 75% 18%, var(--green) 0 6px, transparent 7px),
        radial-gradient(circle at 84% 72%, var(--blue) 0 7px, transparent 8px),
        radial-gradient(circle at 14% 78%, var(--main) 0 6px, transparent 7px),
        radial-gradient(circle at 52% 10%, #f5a3c7 0 5px, transparent 6px);
    }

    .problem-area.correct .confetti {
      opacity: 1;
      animation: pop 0.55s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.82); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    .quiz-view,
    .summary-view {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
      text-align: center;
    }

    .question {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 15px;
      font-weight: 950;
      letter-spacing: 0.04em;
      margin: 6px 0 10px;
      font-size: clamp(3.4rem, 12vw, 6.2rem);
      line-height: 1;
    }

    .question .mark {
      color: var(--main-dark);
      font-size: 0.82em;
    }

    .answer-row {
      display: flex;
      gap: 9px;
      justify-content: center;
      align-items: stretch;
      margin: 10px auto 8px;
      max-width: 380px;
    }

    #answerInput {
      width: 100%;
      border: 2px solid var(--line);
      background: white;
      color: var(--ink);
      outline: none;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 900;
      padding: 10px;
      border-radius: 20px;
    }

    #answerInput:focus {
      border-color: var(--main);
      box-shadow: 0 0 0 4px rgba(255, 159, 104, 0.16);
    }

    .check-btn {
      min-width: 105px;
      border-radius: 20px;
      background: var(--ink);
      color: white;
      font-weight: 950;
      padding: 0 15px;
    }

    .feedback {
      min-height: 42px;
      font-size: 1.08rem;
      font-weight: 900;
      line-height: 1.45;
      display: grid;
      place-items: center;
      margin-top: 2px;
    }

    .feedback.ok {
      color: #348054;
    }

    .feedback.ng {
      color: #bd4141;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: 255px;
      margin: 6px auto 12px;
    }

    .keypad button {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 5px;
      font-size: 1.08rem;
      font-weight: 950;
      color: var(--ink);
      box-shadow: 0 4px 10px rgba(90, 70, 45, 0.08);
      min-height: 42px;
    }

    .keypad .wide {
      grid-column: span 2;
      background: #fff8ef;
      font-size: 1.15rem;
    }

    .scratch-box {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 10px;
      margin: 0 auto;
      max-width: 560px;
      text-align: left;
    }

    .scratch-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .clear-scratch-btn {
      background: #f8f3ed;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 900;
      font-size: 0.84rem;
    }

    .scratch-wrap {
      position: relative;
      width: 100%;
      height: clamp(150px, 28vh, 245px);
      border-radius: 18px;
      overflow: hidden;
      background:
        linear-gradient(#f3e7d8 1px, transparent 1px),
        linear-gradient(90deg, #f3e7d8 1px, transparent 1px),
        #fffefb;
      background-size: 28px 28px;
      border: 2px solid #ead9c6;
      touch-action: none;
    }

    #scratchCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .summary-view {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .summary-view.show {
      display: block;
    }

    .quiz-view.hidden {
      display: none;
    }

    .summary-view h2 {
      font-size: clamp(1.7rem, 4vw, 2.3rem);
      margin: 0 0 10px;
    }

    .summary-score {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 16px auto;
      max-width: 360px;
    }

    .big-stat {
      border-radius: 20px;
      padding: 14px 10px;
      text-align: center;
      background: white;
      border: 1px solid var(--line);
    }

    .big-stat b {
      display: block;
      font-size: 1.8rem;
    }

    .summary-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-width: 280px;
      margin: 16px auto 0;
    }

    .primary-btn {
      width: 100%;
      border-radius: 18px;
      padding: 13px 14px;
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(90, 70, 45, 0.12);
      background: linear-gradient(135deg, var(--main), #ffbf7b);
      color: #3a210f;
    }

    .footer-note {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.7;
    }

    @media (max-width: 520px) {
      .app {
        width: min(100% - 14px, 760px);
        padding-top: 10px;
      }

      .card,
      .title-block {
        border-radius: 22px;
        padding: 13px;
      }

      .status-row {
        grid-template-columns: 1fr;
      }

      .timer-pill {
        justify-self: start;
      }

      .answer-row {
        flex-direction: column;
      }

      .check-btn {
        min-height: 50px;
      }

      .question {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="top-nav">
      <a class="button-link back-btn" href="https://sunedtech-hp.pages.dev/">← サイトに戻る</a>
    </nav>

    <header>
      <section class="title-block">
        <h1>2けた×1けた<br />かけ算トレーニング</h1>
        <p class="subtitle">10問だけ集中して練習します。下の白いスペースには、指やタッチペンで筆算を書けます。</p>
      </section>
    </header>

    <section class="card">
      <div class="status-row">
        <div class="progress-pill" id="progressText">1 / 10問</div>
        <div class="timer-pill">タイム <span id="timerText">00:00</span></div>
      </div>

      <div class="problem-area" id="problemArea">
        <div class="confetti"></div>

        <div class="quiz-view" id="quizView">
          <div class="question">
            <span id="leftNumber">34</span><span class="mark">×</span><span id="rightNumber">7</span>
          </div>

          <div class="answer-row">
            <input id="answerInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="答え" aria-label="答えを入力" />
            <button class="check-btn" id="checkBtn" type="button">答える</button>
          </div>

          <div class="feedback" id="feedback">答えを入力してね。</div>

          <div class="keypad" aria-label="数字キー">
            <button type="button" data-key="1">1</button>
            <button type="button" data-key="2">2</button>
            <button type="button" data-key="3">3</button>
            <button type="button" data-key="4">4</button>
            <button type="button" data-key="5">5</button>
            <button type="button" data-key="6">6</button>
            <button type="button" data-key="7">7</button>
            <button type="button" data-key="8">8</button>
            <button type="button" data-key="9">9</button>
            <button type="button" class="wide" data-key="back">×</button>
            <button type="button" data-key="0">0</button>
          </div>

          <div class="scratch-box">
            <div class="scratch-head">
              <span>筆算スペース</span>
              <button class="clear-scratch-btn" id="clearScratchBtn" type="button">ここを消す</button>
            </div>
            <div class="scratch-wrap">
              <canvas id="scratchCanvas" aria-label="筆算を書くスペース"></canvas>
            </div>
          </div>
        </div>

        <div class="summary-view" id="summaryView">
          <h2 id="summaryTitle">結果</h2>
          <p class="subtitle" id="summaryComment">よくがんばりました。</p>
          <div class="summary-score">
            <div class="big-stat"><b id="sumCorrect">0</b><span>正解</span></div>
            <div class="big-stat"><b id="sumTime">00:00</b><span>タイム</span></div>
          </div>
          <div class="summary-actions">
            <button class="primary-btn" id="againBtn" type="button">もう一度</button>
          </div>
        </div>
      </div>
    </section>

    <p class="footer-note">HTML/CSS/JavaScriptだけで動く、静的サイト用の練習アプリです。</p>
  </main>

  <script>
    (() => {
      "use strict";

      const QUESTION_COUNT = 10;

      const state = {
        questions: [],
        index: 0,
        correct: 0,
        answered: false,
        startedAt: null,
        timerId: null,
        drawing: false,
        lastPoint: null
      };

      const els = {
        progressText: document.getElementById("progressText"),
        timerText: document.getElementById("timerText"),
        problemArea: document.getElementById("problemArea"),
        quizView: document.getElementById("quizView"),
        summaryView: document.getElementById("summaryView"),
        leftNumber: document.getElementById("leftNumber"),
        rightNumber: document.getElementById("rightNumber"),
        answerInput: document.getElementById("answerInput"),
        checkBtn: document.getElementById("checkBtn"),
        feedback: document.getElementById("feedback"),
        keypad: document.querySelector(".keypad"),
        scratchCanvas: document.getElementById("scratchCanvas"),
        clearScratchBtn: document.getElementById("clearScratchBtn"),
        summaryTitle: document.getElementById("summaryTitle"),
        summaryComment: document.getElementById("summaryComment"),
        sumCorrect: document.getElementById("sumCorrect"),
        sumTime: document.getElementById("sumTime"),
        againBtn: document.getElementById("againBtn")
      };

      const ctx = els.scratchCanvas.getContext("2d");

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function makeProblem() {
        const a = randInt(10, 99);
        const b = randInt(2, 9);
        return { a, b, answer: a * b };
      }

      function buildQuestions() {
        const questions = [];
        const seen = new Set();
        let guard = 0;
        while (questions.length < QUESTION_COUNT && guard < 500) {
          guard++;
          const p = makeProblem();
          const key = `${p.a}x${p.b}`;
          if (seen.has(key)) continue;
          seen.add(key);
          questions.push(p);
        }
        while (questions.length < QUESTION_COUNT) questions.push(makeProblem());
        return questions;
      }

      function formatTime(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const min = String(Math.floor(total / 60)).padStart(2, "0");
        const sec = String(total % 60).padStart(2, "0");
        return `${min}:${sec}`;
      }

      function elapsedMs() {
        if (!state.startedAt) return 0;
        return Date.now() - state.startedAt;
      }

      function startTimer() {
        stopTimer();
        state.timerId = window.setInterval(() => {
          els.timerText.textContent = formatTime(elapsedMs());
        }, 500);
      }

      function stopTimer() {
        if (state.timerId) {
          window.clearInterval(state.timerId);
          state.timerId = null;
        }
      }

      function resizeCanvas() {
        const canvas = els.scratchCanvas;
        const rect = canvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        const old = document.createElement("canvas");
        old.width = canvas.width;
        old.height = canvas.height;
        old.getContext("2d").drawImage(canvas, 0, 0);

        canvas.width = Math.max(1, Math.floor(rect.width * ratio));
        canvas.height = Math.max(1, Math.floor(rect.height * ratio));
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#2f2a24";

        if (old.width && old.height) {
          ctx.drawImage(old, 0, 0, old.width / ratio, old.height / ratio);
        }
      }

      function clearScratch() {
        const canvas = els.scratchCanvas;
        const rect = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
      }

      function getCanvasPoint(event) {
        const rect = els.scratchCanvas.getBoundingClientRect();
        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top
        };
      }

      function startDrawing(event) {
        event.preventDefault();
        state.drawing = true;
        state.lastPoint = getCanvasPoint(event);
      }

      function draw(event) {
        if (!state.drawing || !state.lastPoint) return;
        event.preventDefault();
        const point = getCanvasPoint(event);
        ctx.beginPath();
        ctx.moveTo(state.lastPoint.x, state.lastPoint.y);
        ctx.lineTo(point.x, point.y);
        ctx.stroke();
        state.lastPoint = point;
      }

      function stopDrawing() {
        state.drawing = false;
        state.lastPoint = null;
      }

      function setupScratchPad() {
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        els.scratchCanvas.addEventListener("pointerdown", startDrawing);
        els.scratchCanvas.addEventListener("pointermove", draw);
        els.scratchCanvas.addEventListener("pointerup", stopDrawing);
        els.scratchCanvas.addEventListener("pointercancel", stopDrawing);
        els.scratchCanvas.addEventListener("pointerleave", stopDrawing);
        els.clearScratchBtn.addEventListener("click", clearScratch);
      }

      function renderProblem() {
        const current = state.questions[state.index];
        if (!current) return;

        state.answered = false;
        els.problemArea.classList.remove("correct");
        els.leftNumber.textContent = String(current.a);
        els.rightNumber.textContent = String(current.b);
        els.answerInput.value = "";
        els.answerInput.disabled = false;
        els.checkBtn.disabled = false;
        els.feedback.className = "feedback";
        els.feedback.textContent = "答えを入力してね。";
        els.progressText.textContent = `${state.index + 1} / ${QUESTION_COUNT}問`;
        clearScratch();
        window.setTimeout(() => els.answerInput.focus(), 0);
      }

      function normalizeNumber(value) {
        const digits = String(value)
          .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
          .replace(/[^0-9]/g, "");
        return digits === "" ? null : Number(digits);
      }

      function checkAnswer() {
        if (state.answered) return;
        const current = state.questions[state.index];
        if (!current) return;

        const userAnswer = normalizeNumber(els.answerInput.value);
        if (userAnswer === null) {
          els.feedback.className = "feedback ng";
          els.feedback.textContent = "答えを数字で入れてね。";
          els.answerInput.focus();
          return;
        }

        state.answered = true;
        els.answerInput.disabled = true;
        els.checkBtn.disabled = true;

        if (userAnswer === current.answer) {
          state.correct++;
          els.feedback.className = "feedback ok";
          els.feedback.textContent = "正解！いいね！";
          els.problemArea.classList.add("correct");
        } else {
          els.feedback.className = "feedback ng";
          els.feedback.textContent = `おしい！ 正解は ${current.answer} です。`;
        }

        window.setTimeout(() => {
          if (state.index + 1 >= QUESTION_COUNT) {
            finishQuiz();
          } else {
            state.index++;
            renderProblem();
          }
        }, 900);
      }

      function finishQuiz() {
        stopTimer();
        els.timerText.textContent = formatTime(elapsedMs());
        els.quizView.classList.add("hidden");
        els.summaryView.classList.add("show");
        els.progressText.textContent = `10 / 10問 おわり`;
        els.sumCorrect.textContent = `${state.correct} / 10`;
        els.sumTime.textContent = formatTime(elapsedMs());

        if (state.correct === 10) {
          els.summaryTitle.textContent = "全問正解！すごい！";
          els.summaryComment.textContent = "10問ぜんぶ正解です。とてもよくできました。";
        } else if (state.correct >= 8) {
          els.summaryTitle.textContent = "かなりいい感じ！";
          els.summaryComment.textContent = "もう少しで満点です。まちがえたところを確認してみよう。";
        } else if (state.correct >= 6) {
          els.summaryTitle.textContent = "あと少しで安定！";
          els.summaryComment.textContent = "十の位と一の位を分けて、ゆっくり筆算してみよう。";
        } else {
          els.summaryTitle.textContent = "ここから伸びる！";
          els.summaryComment.textContent = "筆算スペースを使って、あせらず1問ずつ確認しよう。";
        }
      }

      function restartQuiz() {
        state.questions = buildQuestions();
        state.index = 0;
        state.correct = 0;
        state.answered = false;
        state.startedAt = Date.now();
        els.timerText.textContent = "00:00";
        els.summaryView.classList.remove("show");
        els.quizView.classList.remove("hidden");
        startTimer();
        renderProblem();
      }

      function appendDigit(key) {
        if (els.answerInput.disabled) return;
        if (key === "back") {
          els.answerInput.value = els.answerInput.value.slice(0, -1);
        } else {
          els.answerInput.value = (els.answerInput.value + key).slice(0, 5);
        }
        els.answerInput.focus();
      }

      els.checkBtn.addEventListener("click", checkAnswer);
      els.againBtn.addEventListener("click", restartQuiz);

      els.keypad.addEventListener("click", event => {
        const btn = event.target.closest("button[data-key]");
        if (!btn) return;
        appendDigit(btn.dataset.key);
      });

      els.answerInput.addEventListener("input", () => {
        els.answerInput.value = els.answerInput.value
          .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
          .replace(/[^0-9]/g, "")
          .slice(0, 5);
      });

      document.addEventListener("keydown", event => {
        const active = document.activeElement;
        const typing = active === els.answerInput;

        if (event.key === "Enter" && !els.quizView.classList.contains("hidden")) {
          event.preventDefault();
          checkAnswer();
          return;
        }

        if (!els.quizView.classList.contains("hidden") && !typing && /^[0-9]$/.test(event.key)) {
          appendDigit(event.key);
        }
      });

      setupScratchPad();
      restartQuiz();
    })();
  </script>
</body>
</html>
