<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語マスター - Happy Learning!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #f0faff;
  --primary: #ff9ecd;
  --secondary: #7ce2d6;
  --accent: #ffd95b;
  --text-dark: #4a3b5a;
  --white: #ffffff;
  --border-width: 3px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body {
  background-color: var(--bg-color);
  background-image: radial-gradient(#d1f0ff 2px, transparent 2px);
  background-size: 30px 30px;
  font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px 16px;
  color: var(--text-dark);
}
.app-wrap { width: 100%; max-width: 500px; }

/* ヘッダー */
.kq-header {
  text-align: center;
  padding: 1.5rem 1rem;
  background: var(--white);
  border: var(--border-width) solid var(--text-dark);
  border-radius: 24px;
  box-shadow: 0 6px 0 var(--text-dark);
  margin-bottom: 1.5rem;
  position: relative;
  overflow: hidden;
}
.kq-header::before { content: "✨"; position: absolute; left: 10px; top: 10px; font-size: 20px; }
.kq-title { font-size: 28px; font-weight: 900; color: var(--primary); }
.kq-sub { font-size: 14px; color: #a084bd; font-weight: 800; margin-top: 4px; }

/* カード */
.card-base {
  background: var(--white);
  border: var(--border-width) solid var(--text-dark);
  border-radius: 24px;
  box-shadow: 0 6px 0 var(--text-dark);
  padding: 1.5rem;
  margin-bottom: 1rem;
}

.section-label {
  font-size: 14px;
  font-weight: 900;
  color: var(--text-dark);
  margin-bottom: 12px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.section-label::before, .section-label::after {
  content: "";
  height: 2px;
  width: 20px;
  background: var(--accent);
}

.opt-section { margin-bottom: 1rem; }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 0; }

.grade-btn, .opt-btn {
  padding: 12px 20px;
  border-radius: 16px;
  border: var(--border-width) solid var(--text-dark);
  background: var(--white);
  color: var(--text-dark);
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.1s;
  box-shadow: 0 4px 0 var(--text-dark);
  font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
}
.grade-btn:hover, .opt-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--text-dark); }
.grade-btn:active, .opt-btn:active { transform: translateY(4px); box-shadow: none; }
.grade-btn.active { background: var(--secondary); color: var(--text-dark); }
.opt-btn.active { background: var(--accent); color: var(--text-dark); }

.grade-count { font-size: 10px; font-weight: 800; display: block; margin-top: 2px; opacity: 0.75; }

.start-btn {
  display: block;
  width: 100%;
  margin: 1.5rem auto 0;
  padding: 18px 0;
  border-radius: 20px;
  background: var(--primary);
  color: var(--white);
  font-size: 22px;
  font-weight: 900;
  border: var(--border-width) solid var(--text-dark);
  box-shadow: 0 6px 0 var(--text-dark);
  cursor: pointer;
  transition: all 0.1s;
  font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
}
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--text-dark); }
.start-btn:active { transform: translateY(6px); box-shadow: none; }

/* 戻るボタン */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--white);
  border: var(--border-width) solid var(--text-dark);
  border-radius: 999px;
  color: var(--text-dark);
  font-size: 13px;
  font-weight: 900;
  padding: 8px 18px;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--text-dark);
  margin-bottom: 14px;
  font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
  transition: all 0.1s;
}
.back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--text-dark); }
.back-btn:active { transform: translateY(4px); box-shadow: none; }

/* サイトに戻るボタン */
.site-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--white);
  border: var(--border-width) solid var(--text-dark);
  border-radius: 999px;
  color: var(--text-dark);
  font-size: 13px;
  font-weight: 900;
  padding: 8px 18px;
  text-decoration: none;
  box-shadow: 0 4px 0 var(--text-dark);
  margin-bottom: 14px;
  font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
  transition: all 0.1s;
}
.site-back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--text-dark); }
.site-back-btn:active { transform: translateY(4px); box-shadow: none; }

/* ベストスコア */
.best-row { text-align: center; margin-top: 15px; font-size: 12px; font-weight: 800; color: #a084bd; min-height: 18px; }

/* ライフ・プログレス */
.lives-row { font-size: 26px; text-align: center; margin-bottom: 10px; filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.1)); }
.prog-wrap { margin-bottom: 0; }
.prog-bg { height: 16px; background: #e0e0e0; border: 2px solid var(--text-dark); border-radius: 999px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--secondary), var(--primary)); transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.prog-label { text-align: right; font-size: 12px; font-weight: 900; margin-top: 5px; }

/* 問題 */
.q-badge {
  background: var(--accent);
  border: 2px solid var(--text-dark);
  padding: 4px 15px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 900;
  display: inline-block;
}
.combo-badge {
  background: #fde68a;
  border: 2px solid #b45309;
  padding: 4px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 900;
  color: #92400e;
  margin-left: 8px;
  display: inline-block;
}
.q-prompt { font-size: 13px; font-weight: 800; color: #a084bd; margin: 10px 0 4px; }
.q-word { font-size: 36px; font-weight: 900; color: var(--text-dark); margin: 12px 0; line-height: 1.2; word-break: break-all; }

.choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
.choice-btn {
  padding: 15px 10px;
  border-radius: 18px;
  border: var(--border-width) solid var(--text-dark);
  background: var(--white);
  color: var(--text-dark);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--text-dark);
  transition: all 0.1s;
  font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
  line-height: 1.3;
  min-height: 56px;
}
.choice-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 var(--text-dark); }
.choice-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
.choice-btn.correct { background: #a7f3d0 !important; animation: bounce 0.5s; }
.choice-btn.wrong { background: #fca5a5 !important; animation: shake 0.4s; }
.choice-btn:disabled { cursor: default; transform: none; }

@keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.feedback-area { margin-top: 15px; font-size: 20px; font-weight: 900; min-height: 30px; text-align: center; }
.fb-ok { color: #059669; }
.fb-ng { color: #dc2626; }

.next-btn {
  width: 100%;
  padding: 15px;
  border-radius: 999px;
  background: var(--secondary);
  color: var(--text-dark);
  border: var(--border-width) solid var(--text-dark);
  box-shadow: 0 5px 0 var(--text-dark);
  font-size: 18px;
  font-weight: 900;
  margin-top: 15px;
  cursor: pointer;
  font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
  transition: all 0.1s;
}
.next-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--text-dark); }
.next-btn:active { transform: translateY(5px); box-shadow: none; }

/* 結果 */
.result-score { font-size: 64px; font-weight: 900; color: var(--primary); -webkit-text-stroke: 2px var(--text-dark); margin: 10px 0; }
.result-icon { font-size: 56px; margin-bottom: 4px; }
.result-msg { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
.result-detail { font-size: 14px; font-weight: 800; color: #a084bd; margin-bottom: 20px; }
.action-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.act-btn {
  padding: 12px 24px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 900;
  border: var(--border-width) solid var(--text-dark);
  cursor: pointer;
  box-shadow: 0 4px 0 var(--text-dark);
  font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
  transition: all 0.1s;
}
.act-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--text-dark); }
.act-btn:active { transform: translateY(4px); box-shadow: none; }
.act-primary { background: var(--primary); color: var(--white); }
.act-secondary { background: var(--accent); color: var(--text-dark); }

/* 間違い一覧 */
.miss-section { text-align: left; margin-top: 1.5rem; }
.miss-title { font-size: 14px; font-weight: 900; color: var(--text-dark); margin-bottom: 10px; text-align: center; }
.miss-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border-radius: 14px;
  background: #fff7ed;
  border: 2px solid var(--text-dark);
  margin-bottom: 8px;
  gap: 12px;
}
.miss-en { font-size: 15px; font-weight: 900; color: var(--primary); }
.miss-ja { font-size: 14px; font-weight: 800; color: var(--text-dark); }

/* 単語リスト */
.word-list-card { background: var(--white); border: var(--border-width) solid var(--text-dark); border-radius: 24px; box-shadow: 0 6px 0 var(--text-dark); padding: 1.25rem; }
.word-list-title { font-size: 18px; font-weight: 900; color: var(--text-dark); margin-bottom: 6px; text-align: center; }
.wl-count { text-align: center; font-size: 12px; font-weight: 800; color: #a084bd; margin-bottom: 12px; }
.word-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 55vh; overflow-y: auto; padding-right: 4px; }
.word-grid::-webkit-scrollbar { width: 8px; }
.word-grid::-webkit-scrollbar-track { background: #eee; border-radius: 10px; }
.word-grid::-webkit-scrollbar-thumb { background: var(--text-dark); border-radius: 10px; }
.word-cell { background: #fff; border: 2px solid var(--text-dark); border-radius: 12px; padding: 10px; }
.word-cell-en { font-size: 14px; font-weight: 900; color: var(--primary); }
.word-cell-ja { font-size: 12px; font-weight: 800; color: var(--text-dark); margin-top: 2px; }

@media(max-width:400px){
  .q-word { font-size: 28px; }
  .choices-grid { grid-template-columns: 1fr; }
  .choice-btn { font-size: 14px; }
}
</style>
</head>
<body>
<div class="app-wrap">

  <div style="text-align:left; margin-bottom:4px;">
    <a class="site-back-btn" href="https://sun-ed-tech.vercel.app/">🏠 サイトに戻る</a>
  </div>

  <div class="kq-header">
    <div class="kq-title">ENGLISH MASTER</div>
    <div class="kq-sub">〜 英単語を攻略せよ！ 〜</div>
  </div>

  <!-- スタート画面 -->
  <div id="setup-screen" class="card-base">
    <div class="opt-section">
      <div class="section-label">学年をえらぶ</div>
      <div class="btn-row">
        <button class="grade-btn active" onclick="setGrade(1)">中1<span class="grade-count" id="cnt1"></span></button>
        <button class="grade-btn" onclick="setGrade(2)">中2<span class="grade-count" id="cnt2"></span></button>
        <button class="grade-btn" onclick="setGrade(3)">中3<span class="grade-count" id="cnt3"></span></button>
        <button class="grade-btn" onclick="setGrade(0)">全部<span class="grade-count" id="cnt0"></span></button>
      </div>
    </div>
    <div class="opt-section">
      <div class="section-label">テストの形式</div>
      <div class="btn-row">
        <button class="opt-btn active" onclick="setMode('en2ja')">英 → 日</button>
        <button class="opt-btn" onclick="setMode('ja2en')">日 → 英</button>
      </div>
    </div>
    <div class="opt-section">
      <div class="section-label">問題数</div>
      <div class="btn-row">
        <button class="opt-btn active" onclick="setCount(5)">5問</button>
        <button class="opt-btn" onclick="setCount(10)">10問</button>
      </div>
    </div>
    <button class="start-btn" onclick="startQuiz()">QUIZ START! 🚀</button>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;">
      <button class="opt-btn" style="font-size:12px;padding:8px 14px;" onclick="showWordList(1)">中1単語帳</button>
      <button class="opt-btn" style="font-size:12px;padding:8px 14px;" onclick="showWordList(2)">中2単語帳</button>
      <button class="opt-btn" style="font-size:12px;padding:8px 14px;" onclick="showWordList(3)">中3単語帳</button>
    </div>
    <div class="best-row" id="best-display"></div>
  </div>

  <!-- クイズ画面 -->
  <div id="quiz-screen" style="display:none;">
    <button class="back-btn" onclick="showSetup()">← もどる</button>
    <div class="lives-row" id="lives-row"></div>
    <div class="card-base" style="padding-top:12px;">
      <div class="prog-wrap">
        <div class="prog-bg"><div class="prog-fill" id="prog" style="width:0%"></div></div>
        <div class="prog-label" id="prog-label"></div>
      </div>
      <div style="text-align:center; margin-top:18px;">
        <span class="q-badge" id="q-badge">第1問</span>
        <span class="combo-badge" id="combo-badge" style="display:none;">コンボ x0</span>
        <div class="q-prompt" id="q-prompt"></div>
        <div class="q-word" id="q-word"></div>
        <div id="choices-area"></div>
        <div class="feedback-area" id="feedback"></div>
        <button class="next-btn" id="next-btn" style="display:none;" onclick="nextQ()">つぎの問題へ 🚀</button>
      </div>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen" style="display:none;">
    <button class="back-btn" onclick="showSetup()">← もどる</button>
    <div class="card-base" style="text-align:center;">
      <div class="result-icon" id="r-icon"></div>
      <div class="result-score" id="r-score"></div>
      <div class="result-msg" id="r-msg"></div>
      <div class="result-detail" id="r-detail"></div>
      <div class="action-row">
        <button class="act-btn act-primary" onclick="showSetup()">もう一度！</button>
        <button class="act-btn act-secondary" id="retry-miss-btn" onclick="retryMissed()" style="display:none;">間違い復習</button>
      </div>
      <div class="miss-section" id="miss-section" style="display:none;">
        <div class="miss-title">間違えた単語</div>
        <div id="miss-list"></div>
      </div>
    </div>
  </div>

  <!-- 単語リスト画面 -->
  <div id="word-list-screen" style="display:none;">
    <button class="back-btn" onclick="showSetup()">← もどる</button>
    <div class="word-list-card">
      <div class="word-list-title" id="wl-title"></div>
      <div class="wl-count" id="wl-count"></div>
      <div class="word-grid" id="wl-grid"></div>
    </div>
  </div>

</div>
<script>

  {en:"strawberry",ja:"イチゴ"}, {en:"lemon",ja:"レモン"}, {en:"cherry",ja:"さくらんぼ"},

// ========== 全単語プール構築 ==========
const WORDS = { 1: W1, 2: W2, 3: W3 };

// ========== アプリ状態 ==========
let grade=1, mode='en2ja', totalCount=5;
let pool=[], queue=[], qIdx=0, correct=0, missed=[], hearts=3, combo=0, maxCombo=0;
let answered=false;

// ========== 設定 ==========
function setGrade(g){
  grade=g;
  document.querySelectorAll('.grade-btn').forEach((b,i)=>b.classList.toggle('active',i===(g===0?3:g-1)));
  updateBestDisplay();
}
function setMode(m){
  mode=m;
  const btns=document.querySelectorAll('.opt-section:nth-child(2) .opt-btn');
  const modes=['en2ja','ja2en'];
  btns.forEach((b,i)=>b.classList.toggle('active',modes[i]===m));
  updateBestDisplay();
}
function setCount(n){
  totalCount=n;
  const btns=document.querySelectorAll('.opt-section:nth-child(3) .opt-btn');
  [5,10].forEach((v,i)=>btns[i] && btns[i].classList.toggle('active',v===n));
}

function updateBestDisplay(){
  const key='bestScore_'+grade+'_'+mode;
  const saved=localStorage.getItem(key);
  const el=document.getElementById('best-display');
  if(saved){
    const d=JSON.parse(saved);
    el.textContent='このモードのベスト: '+d.score+'点（'+d.date+'）';
  } else {
    el.textContent='まだ記録なし';
  }
}

// 単語数バッジ更新（データ変更時も自動反映）
function updateWordCounts(){
  document.getElementById('cnt1').textContent=W1.length+'語';
  document.getElementById('cnt2').textContent=W2.length+'語';
  document.getElementById('cnt3').textContent=W3.length+'語';
  document.getElementById('cnt0').textContent=(W1.length+W2.length+W3.length)+'語';
}

// ========== SRS: localStorageキー ==========
const SRS_KEY = 'srs_data';

// SRSデータ読み込み
// 構造: { "mother": { correct: 3, wrong: 1 }, ... }
function loadSRS(){
  try { return JSON.parse(localStorage.getItem(SRS_KEY)) || {}; }
  catch(e){ return {}; }
}

// SRSデータ保存
function saveSRS(data){
  localStorage.setItem(SRS_KEY, JSON.stringify(data));
}

// 単語の重み計算（間違いが多いほど重みが大きい→出やすい）
// 正解回数が多いほど重みが小さい（最小値1を保証）
function getWeight(word, srsData){
  const d = srsData[word.en];
  if(!d) return 10; // 初出: 中程度の重み
  const c = d.correct || 0;
  const w = d.wrong || 0;
  // 間違い +3pt、正解 -2pt、最小1
  return Math.max(1, 10 + w * 3 - c * 2);
}

// 重み付きランダム抽出（重複なし）
function weightedSample(pool, n, srsData){
  const arr = [...pool];
  const result = [];
  for(let i = 0; i < n && arr.length > 0; i++){
    const weights = arr.map(w => getWeight(w, srsData));
    const total = weights.reduce((a,b)=>a+b, 0);
    let r = Math.random() * total;
    let idx = 0;
    for(let j = 0; j < weights.length; j++){
      r -= weights[j];
      if(r <= 0){ idx = j; break; }
    }
    result.push(arr[idx]);
    arr.splice(idx, 1);
  }
  return result;
}

// ========== プール作成 ==========
function getPool(){
  if(grade===0) return [...W1,...W2,...W3];
  return [...WORDS[grade]];
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ========== クイズ開始 ==========
function startQuiz(){
  const srsData = loadSRS();
  pool = getPool();
  // SRS重み付き抽出
  queue = weightedSample(pool, Math.min(totalCount, pool.length), srsData);
  qIdx=0;correct=0;missed=[];hearts=3;combo=0;maxCombo=0;answered=false;
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='block';
  renderLives();
  showQ();
}

function renderLives(){
  document.getElementById('lives-row').innerHTML=
    Array.from({length:3},(_,i)=>`<span>${i<hearts?'❤️':'🖤'}</span>`).join('');
}

// ========== 問題表示 ==========
function showQ(){
  answered=false;
  const w=queue[qIdx];
  const pct=Math.round((qIdx/queue.length)*100);
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-label').textContent=(qIdx+1)+' / '+queue.length+'問';
  document.getElementById('q-badge').textContent='第'+(qIdx+1)+'問';
  const cb=document.getElementById('combo-badge');
  if(combo>=2){cb.style.display='';cb.textContent='コンボ x'+combo;}else{cb.style.display='none';}
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback-area';
  document.getElementById('next-btn').style.display='none';

  const isEn=(mode==='en2ja');
  document.getElementById('q-prompt').textContent=isEn?'この英語の日本語訳は？':'この日本語の英語は？';
  document.getElementById('q-word').textContent=isEn?w.en:w.ja;
  const allPool=getPool();
  const others=shuffle(allPool.filter(x=>x.en!==w.en)).slice(0,3);
  const choices=shuffle([w,...others]);
  document.getElementById('choices-area').innerHTML=
    '<div class="choices-grid">'+
    choices.map(c=>`<button class="choice-btn" data-en="${c.en}" onclick="checkChoice(this,'${w.en}')">${isEn?c.ja:c.en}</button>`).join('')+
    '</div>';
}

// ========== 正誤判定（4択）==========
function checkChoice(btn,correctEn){
  if(answered)return;
  answered=true;
  const chosen=btn.getAttribute('data-en');
  const isOk=(chosen===correctEn);
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled=true;
    if(b.getAttribute('data-en')===correctEn)b.classList.add('correct');
  });
  const w=queue[qIdx];

  // SRS記録を更新
  const srsData = loadSRS();
  if(!srsData[w.en]) srsData[w.en] = {correct:0, wrong:0};
  if(isOk){
    srsData[w.en].correct++;
    correct++;combo++;if(combo>maxCombo)maxCombo=combo;
    setFb(true,combo>=3?'すごい! コンボ '+combo+'!! 🎉':'せいかい! ✓');
  } else {
    srsData[w.en].wrong++;
    hearts=Math.max(0,hearts-1);combo=0;missed.push(w);
    btn.classList.add('wrong');
    setFb(false,'ざんねん... 正解: '+(mode==='en2ja'?w.ja:w.en)+' ✗');
  }
  saveSRS(srsData);

  renderLives();
  updateCombo();
  document.getElementById('next-btn').style.display='block';
  if(hearts<=0)setTimeout(()=>showResult(),800);
}

function setFb(ok,msg){
  const el=document.getElementById('feedback');
  el.className='feedback-area '+(ok?'fb-ok':'fb-ng');
  el.textContent=msg;
}
function updateCombo(){
  const cb=document.getElementById('combo-badge');
  if(combo>=2){cb.style.display='';cb.textContent='コンボ x'+combo;}else{cb.style.display='none';}
}

// ========== 次の問題 ==========
function nextQ(){
  qIdx++;
  if(qIdx>=queue.length||hearts<=0)showResult();
  else showQ();
}

// ========== 結果表示 ==========
function showResult(){
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('result-screen').style.display='block';
  const done=Math.min(qIdx+(answered?1:0),queue.length);
  const pct=done>0?Math.round((correct/done)*100):0;
  const icons=['😢','😅','🙂','😊','🌟','🎉'];
  const msgs=['もう少し練習しよう!','だいじょうぶ、またやってみて!','いいかんじ!','よくできました!','すばらしい!','かんぺき! 天才!!'];
  const idx=pct===100?5:Math.min(Math.floor(pct/20),4);
  document.getElementById('r-icon').textContent=icons[idx];
  document.getElementById('r-score').textContent=pct+'点';
  document.getElementById('r-msg').textContent=msgs[idx];
  document.getElementById('r-detail').textContent=correct+' / '+done+' 問正解 | 最高コンボ: '+maxCombo;
  // ベストスコア保存
  const key='bestScore_'+grade+'_'+mode;
  const saved=localStorage.getItem(key);
  const today=new Date().toLocaleDateString('ja-JP');
  if(!saved||JSON.parse(saved).score<pct){
    localStorage.setItem(key,JSON.stringify({score:pct,date:today}));
    if(saved && JSON.parse(saved).score<pct)
      document.getElementById('r-msg').textContent+=' 🏆ベスト更新!';
  }
  // SRS状況サマリーを結果詳細に追加
  const srsData = loadSRS();
  const poolAll = getPool();
  const weakWords = poolAll
    .filter(w => srsData[w.en] && srsData[w.en].wrong > 0)
    .sort((a,b)=>(srsData[b.en].wrong - srsData[b.en].correct*0.5) - (srsData[a.en].wrong - srsData[a.en].correct*0.5))
    .slice(0,3);
  const weakStr = weakWords.length > 0
    ? ' | 要注意: '+weakWords.map(w=>w.en).join('・')
    : '';
  document.getElementById('r-detail').textContent += weakStr;
  // 間違い一覧
  const retryBtn=document.getElementById('retry-miss-btn');
  const missSection=document.getElementById('miss-section');
  if(missed.length>0){
    retryBtn.style.display='';
    missSection.style.display='';
    document.getElementById('miss-list').innerHTML=
      missed.map(w=>`<div class="miss-item"><span class="miss-en">${w.en}</span><span class="miss-ja">${w.ja}</span></div>`).join('');
  } else {
    retryBtn.style.display='none';
    missSection.style.display='none';
  }
}

function retryMissed(){
  const srsData = loadSRS();
  pool=getPool();
  queue=weightedSample([...missed], missed.length, srsData);
  qIdx=0;correct=0;missed=[];hearts=3;combo=0;maxCombo=0;answered=false;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='block';
  renderLives();
  showQ();
}

function showSetup(){
  ['quiz-screen','result-screen','word-list-screen'].forEach(id=>{
    document.getElementById(id).style.display='none';
  });
  document.getElementById('setup-screen').style.display='block';
  updateBestDisplay();
}

// 単語リスト画面表示（SRS状況も色で表示）
function showWordList(g){
  const names={1:'中1',2:'中2',3:'中3'};
  const wlist=WORDS[g];
  const srsData=loadSRS();
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('word-list-screen').style.display='block';
  document.getElementById('wl-title').textContent=names[g]+' 単語帳';
  document.getElementById('wl-count').textContent='全'+wlist.length+'語';
  document.getElementById('wl-grid').innerHTML=
    wlist.map(w=>{
      const d=srsData[w.en];
      let badge='';
      let bg='';
      if(d){
        const net = (d.correct||0) - (d.wrong||0)*1.5;
        if(net >= 3){ bg='background:#d1fae5;'; badge='<span style="font-size:10px;color:#065f46;">✓ 得意</span>'; }
        else if(d.wrong > 0){ bg='background:#fff7ed;'; badge='<span style="font-size:10px;color:#c2410c;">✗ 要注意</span>'; }
      }
      return `<div class="word-cell" style="${bg}">
        <div class="word-cell-en">${w.en}</div>
        <div class="word-cell-ja">${w.ja}</div>
        ${badge}
      </div>`;
    }).join('');
}

updateWordCounts();
updateBestDisplay();
