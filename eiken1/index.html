<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>Math &amp; Science Vocab Quiz</title>  <style>    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }    :root {      --color-background-primary: #ffffff;      --color-background-secondary: #f5f4f0;      --color-text-primary: #1a1a1a;      --color-text-secondary: #6b6b6b;      --color-border-tertiary: rgba(0,0,0,0.12);      --color-border-secondary: rgba(0,0,0,0.22);      --color-border-primary: rgba(0,0,0,0.32);      --border-radius-md: 8px;      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;    }    @media (prefers-color-scheme: dark) {      :root {        --color-background-primary: #1e1e1e;        --color-background-secondary: #2a2a2a;        --color-text-primary: #f0f0f0;        --color-text-secondary: #a0a0a0;        --color-border-tertiary: rgba(255,255,255,0.12);        --color-border-secondary: rgba(255,255,255,0.22);        --color-border-primary: rgba(255,255,255,0.32);      }      .badge-math { background: #3C3489 !important; color: #CECBF6 !important; }      .badge-sci  { background: #085041 !important; color: #9FE1CB !important; }      .opt-btn.correct { background: #173404 !important; border-color: #639922 !important; color: #C0DD97 !important; }      .opt-btn.wrong   { background: #501313 !important; border-color: #A32D2D !important; color: #F7C1C1 !important; }      .feedback.ok { background: #173404 !important; color: #C0DD97 !important; border-color: #3B6D11 !important; }      .feedback.ng { background: #501313 !important; color: #F7C1C1 !important; border-color: #A32D2D !important; }      .hint-btn { background: #3C3489 !important; color: #CECBF6 !important; border-color: #534AB7 !important; }      .hint-btn:hover:not(:disabled) { background: #534AB7 !important; }      .hint-box { background: #412402 !important; color: #FAC775 !important; border-color: #854F0B !important; }      .score-num { color: #AFA9EC !important; }    }    body {      font-family: var(--font-sans);      background: var(--color-background-primary);      color: var(--color-text-primary);      min-height: 100vh;      display: flex;      justify-content: center;      padding: 2rem 1rem;    }    .quiz-wrap { width: 100%; max-width: 680px; }    .prog-bar-bg { height: 6px; background: var(--color-background-secondary); border-radius: 3px; margin-bottom: 1.25rem; border: 0.5px solid var(--color-border-tertiary); }    .prog-bar-fill { height: 100%; background: #7F77DD; border-radius: 3px; transition: width 0.4s ease; }    .q-header { display: flex; align-items: center; gap: 8px; margin-bottom: 0.75rem; flex-wrap: wrap; }    .badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: var(--border-radius-md); letter-spacing: .02em; }    .badge-math { background: #EEEDFE; color: #3C3489; }    .badge-sci  { background: #E1F5EE; color: #085041; }    .q-counter  { font-size: 13px; color: var(--color-text-secondary); margin-left: auto; }    .passage { border-left: 3px solid #7F77DD; background: var(--color-background-secondary); padding: 0.75rem 1rem; border-radius: 0 var(--border-radius-md) var(--border-radius-md) 0; font-size: 14px; line-height: 1.7; color: var(--color-text-primary); margin-bottom: 1rem; }    .passage .kw { text-decoration: underline dotted #7F77DD; text-decoration-thickness: 2px; text-underline-offset: 3px; font-weight: 500; }    .q-text { font-size: 15px; font-weight: 500; margin-bottom: 0.75rem; line-height: 1.6; }    .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }    .opt-btn { text-align: left; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; font-size: 14px; cursor: pointer; color: var(--color-text-primary); transition: background 0.15s, border-color 0.15s; line-height: 1.5; font-family: var(--font-sans); }    .opt-btn:hover:not(:disabled) { background: var(--color-background-secondary); border-color: var(--color-border-primary); }    .opt-btn.correct { background: #EAF3DE; border-color: #3B6D11; color: #173404; font-weight: 500; }    .opt-btn.wrong   { background: #FCEBEB; border-color: #A32D2D; color: #501313; }    .opt-btn:disabled { cursor: default; }    .hint-row { display: flex; gap: 8px; margin-bottom: 0.75rem; flex-wrap: wrap; }    .hint-btn { background: #EEEDFE; color: #3C3489; border: 0.5px solid #AFA9EC; border-radius: var(--border-radius-md); padding: 5px 12px; font-size: 12px; cursor: pointer; transition: background 0.15s; font-family: var(--font-sans); }    .hint-btn:hover:not(:disabled) { background: #CECBF6; }    .hint-btn:disabled { opacity: 0.45; cursor: default; }    .hint-box { background: #FAEEDA; color: #412402; border: 0.5px solid #EF9F27; border-radius: var(--border-radius-md); padding: 0.6rem 0.9rem; font-size: 13px; line-height: 1.6; margin-bottom: 0.75rem; }    .hint-box p + p { margin-top: 6px; }    .feedback { border-radius: var(--border-radius-md); padding: 0.7rem 1rem; font-size: 13px; line-height: 1.6; margin-bottom: 0.75rem; }    .feedback.ok { background: #EAF3DE; color: #173404; border: 0.5px solid #639922; }    .feedback.ng { background: #FCEBEB; color: #501313; border: 0.5px solid #A32D2D; }    .feedback strong { font-weight: 500; }    .next-btn { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 9px 20px; font-size: 14px; cursor: pointer; color: var(--color-text-primary); display: block; margin-top: 0.5rem; font-family: var(--font-sans); }    .next-btn:hover { background: var(--color-background-secondary); }    .result-wrap { text-align: center; padding: 2rem 1rem; }    .score-num { font-size: 40px; font-weight: 500; color: #534AB7; }    .score-lbl  { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 1rem; }    .result-msg { font-size: 15px; margin-bottom: 1.5rem; line-height: 1.6; }    .try-btn { background: #7F77DD; color: #fff; border: none; border-radius: var(--border-radius-md); padding: 10px 28px; font-size: 14px; cursor: pointer; font-family: var(--font-sans); }    .try-btn:hover { background: #534AB7; }    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }</style></head><body>  <h1 class="sr-only">Math &amp; Science Vocabulary Quiz</h1><h1 style="font-size:20px;font-weight:500;color:var(--color-text-primary);margin-bottom:1.25rem;">英検２級トレーニング</h1>  <div class="quiz-wrap" id="app"></div>  <script>  const ALL_Q = [    { cat:"Math", passage:'A <span class="kw">fraction</span> represents a part of a whole. It has a <span class="kw">numerator</span> on top and a <span class="kw">denominator</span> on the bottom. For example, 3/4 means three parts out of four equal parts. Fractions can be compared, added, or multiplied.', q:"What does the denominator of a fraction represent?", opts:["The total number of equal parts","The number of parts selected","The result of multiplication","The difference between two numbers"], ans:0, exp:"The denominator is the bottom number of a fraction. It tells you how many equal parts the whole is divided into.", hints:["分数の形を思い出そう：分子／分母","分数 3/4 の「4」に注目しよう","分母は「全体をいくつに分けたか」を表す数だよ"] },    { cat:"Math", passage:'An <span class="kw">equilateral triangle</span> is a special triangle. All three sides have the same length, and all three <span class="kw">angles</span> are equal. Each angle measures 60 degrees. It is one of the most <span class="kw">symmetric</span> shapes in geometry.', q:"How large is each angle in an equilateral triangle?", opts:["90 degrees","45 degrees","60 degrees","120 degrees"], ans:2, exp:"An equilateral triangle has three equal angles, and since all angles in a triangle add up to 180°, each angle is 180÷3 = 60°.", hints:["三角形の内角の和を思い出そう","正三角形はすべての角が等しい","180° ÷ 3 を計算してみよう"] },    { cat:"Math", passage:'The <span class="kw">diameter</span> of a circle is a straight line that passes through the <span class="kw">center</span> and touches two points on the edge. It is exactly twice the length of the <span class="kw">radius</span>. Knowing the diameter helps us calculate the <span class="kw">circumference</span>.', q:"What is the relationship between diameter and radius?", opts:["Diameter equals radius divided by 2","Diameter equals radius multiplied by 2","Diameter equals radius plus 10","Diameter and radius are equal"], ans:1, exp:"The radius goes from the center to the edge of the circle. The diameter crosses the full circle through the center, so it is twice the radius.", hints:["直径と半径は円の中心を通るか通らないかで違う","半径（radius）は中心から端まで","直径（diameter）は円を横断する — つまり半径の何倍？"] },    { cat:"Math", passage:'A <span class="kw">prime number</span> is a whole number greater than 1 that can only be divided evenly by 1 and itself. The first few prime numbers are 2, 3, 5, 7, and 11. The number 1 is <span class="kw">not</span> considered prime. Prime numbers are the building blocks of all other whole numbers.', q:"Which of the following is NOT a prime number?", opts:["7","11","9","13"], ans:2, exp:"9 = 3 × 3, so it has a divisor other than 1 and itself. That means 9 is not a prime number.", hints:["素数は1と自分自身でしか割り切れない数","9を3で割ってみよう","割り切れたら素数ではないよ"] },    { cat:"Math", passage:'The <span class="kw">volume</span> of a rectangular box is found by multiplying its length, width, and height. The formula is V = l × w × h. Volume is measured in <span class="kw">cubic units</span>, such as cm³. A larger volume means the box can hold more material.', q:"What formula gives the volume of a rectangular box?", opts:["V = l + w + h","V = l × w + h","V = l × w × h","V = 2(l + w + h)"], ans:2, exp:"Volume is the amount of space inside a 3D shape. For a rectangular box you multiply all three dimensions: length × width × height.", hints:["体積は「かさ」を求めること","2D では面積 = 縦 × 横、3D では…","直方体の体積は3辺をすべてかける"] },    { cat:"Math", passage:'Two lines are called <span class="kw">parallel</span> when they lie in the same plane and never meet, no matter how far they are extended. The distance between <span class="kw">parallel lines</span> is always the same. Railroad tracks are a common real-world example of parallel lines.', q:"Which statement best describes parallel lines?", opts:["They always cross at a right angle","They meet at exactly one point","They never intersect and stay the same distance apart","They curve toward each other over long distances"], ans:2, exp:"Parallel lines remain the same distance apart and never meet. This is what makes them different from intersecting or perpendicular lines.", hints:["平行な線路を思い浮かべよう","平行線は交わる？交わらない？","距離は一定のまま — どこまで伸ばしても"] },    { cat:"Math", passage:'An <span class="kw">equation</span> is a mathematical statement that shows two expressions are equal, using an equals sign (=). Solving an equation means finding the value of the unknown <span class="kw">variable</span>. For example, x + 3 = 7 can be solved to get x = 4.', q:"What does it mean to 'solve' an equation?", opts:["To draw a graph of the equation","To find the value of the unknown variable","To multiply both sides by zero","To remove the equals sign"], ans:1, exp:"Solving an equation means finding what value the variable (like x) must have to make both sides of the equation equal.", hints:["方程式には未知数（x など）が含まれる","「解く」= 未知数の値を求めること","x + 3 = 7 のとき、x はいくつ？"] },    { cat:"Science", passage:'<span class="kw">Evaporation</span> is the process by which a liquid changes into a <span class="kw">vapor</span> or gas. It happens at the surface of a liquid when water molecules gain enough <span class="kw">energy</span> to escape into the air. Heat speeds up evaporation. Oceans, lakes, and puddles all lose water through evaporation.', q:"What causes evaporation to happen faster?", opts:["Adding more salt to the water","Covering the liquid tightly","Increasing the temperature","Decreasing the surface area"], ans:2, exp:"Heat gives water molecules more energy, allowing them to escape from the liquid surface more quickly. Higher temperature = faster evaporation.", hints:["蒸発は水が気体になる現象","分子が「逃げる」にはエネルギーが必要","温度が上がると分子の動きはどうなる？"] },    { cat:"Science", passage:'<span class="kw">Photosynthesis</span> is the process plants use to make their own food. They absorb <span class="kw">sunlight</span>, take in <span class="kw">carbon dioxide</span> from the air, and use water from the soil. The plant produces <span class="kw">glucose</span> and releases oxygen as a byproduct.', q:"What gas is released by plants as a byproduct of photosynthesis?", opts:["Carbon dioxide","Nitrogen","Hydrogen","Oxygen"], ans:3, exp:"During photosynthesis, plants take in CO₂ and water, and use sunlight to produce glucose. Oxygen (O₂) is released as a byproduct — which is why plants are vital to life on Earth.", hints:["光合成は植物が光でエネルギーを作る仕組み","材料は水・二酸化炭素・光","副産物として放出される気体は何？"] },    { cat:"Science", passage:'All living things are made of <span class="kw">cells</span>. Cells are the basic unit of life. Most cells are too small to see with the naked eye and require a <span class="kw">microscope</span>. A cell contains a <span class="kw">nucleus</span>, which controls cell activity, and is surrounded by a <span class="kw">cell membrane</span>.', q:"What is the role of the nucleus inside a cell?", opts:["To produce energy from sunlight","To control cell activity","To store water for the cell","To break down waste materials"], ans:1, exp:"The nucleus acts as the control center of the cell. It contains DNA, which carries instructions for cell growth, function, and reproduction.", hints:["細胞の中心にある丸い構造を思い出そう","核（nucleus）は細胞の「司令塔」","DNA はどこにある？"] },    { cat:"Science", passage:'<span class="kw">Gravity</span> is a force that pulls objects toward each other. On Earth, gravity pulls everything toward the center of the planet. The strength of gravity depends on the <span class="kw">mass</span> of the objects and the distance between them. Without gravity, we would float off the surface.', q:"What two factors affect the strength of gravity between objects?", opts:["Color and temperature","Mass and distance","Speed and volume","Shape and texture"], ans:1, exp:"Gravity depends on the masses of the two objects involved and the distance between them. Greater mass = stronger gravity; greater distance = weaker gravity.", hints:["重力は物体の間に働く力","月と地球はなぜ引き合う？","質量（mass）と距離（distance）がキーワード"] },    { cat:"Science", passage:'A <span class="kw">magnet</span> has two poles: a <span class="kw">north pole</span> and a <span class="kw">south pole</span>. Opposite poles attract each other, while like poles <span class="kw">repel</span>. The area around a magnet where its force can be felt is called the <span class="kw">magnetic field</span>.', q:"What happens when two north poles of magnets are placed near each other?", opts:["They attract strongly","They repel each other","They cancel each other out","They switch poles"], ans:1, exp:"Like poles (N–N or S–S) repel each other. Only opposite poles (N–S) attract. This is a fundamental property of magnets.", hints:["磁石には N 極と S 極がある","同じ極どうしを近づけたことはある？","「同極反発、異極吸引」を思い出そう"] },    { cat:"Science", passage:'<span class="kw">Density</span> is defined as the mass of an object divided by its volume (D = m/V). A dense object has a lot of mass packed into a small space. Objects less dense than water will <span class="kw">float</span>, while denser objects will <span class="kw">sink</span>.', q:"What happens to an object that is less dense than water?", opts:["It sinks immediately","It dissolves in water","It floats on the water surface","It gains more mass"], ans:2, exp:"When an object's density is lower than water (1 g/cm³), the buoyant force from water is strong enough to keep it floating on the surface.", hints:["密度 = 質量 ÷ 体積","水の密度は約 1 g/cm³","密度が水より小さいとどうなる？"] },    { cat:"Science", passage:'<span class="kw">Digestion</span> is the process of breaking down food into small <span class="kw">nutrients</span> that the body can absorb. It begins in the mouth with chewing and <span class="kw">saliva</span>. The stomach and intestines continue the process using acids and <span class="kw">enzymes</span>.', q:"Where does digestion first begin?", opts:["In the stomach","In the small intestine","In the liver","In the mouth"], ans:3, exp:"Digestion starts in the mouth. Chewing breaks food into smaller pieces, and saliva contains enzymes (like amylase) that begin breaking down carbohydrates.", hints:["消化はどこで始まる？食べ物が最初に入る場所は？","口の中では何が起きている？","噛む（咀嚼）と唾液（saliva）の働きに注目"] },    { cat:"Science", passage:'An <span class="kw">electrical circuit</span> is a closed path through which <span class="kw">electric current</span> can flow. A simple circuit needs a <span class="kw">battery</span>, wires, and a <span class="kw">load</span> such as a light bulb. If the circuit is broken — for example, by a switch — the current stops flowing.', q:"What happens to the current when an electrical circuit is broken?", opts:["It doubles in strength","It flows in the opposite direction","It stops flowing","It is stored in the wire"], ans:2, exp:"Electric current requires a complete, unbroken path (closed circuit) to flow. If the path is interrupted — for example, by opening a switch — current stops immediately.", hints:["電流が流れるには「閉じた回路」が必要","スイッチを切ったときの豆電球を思い出そう","回路が途切れると電流は…？"] }  ];const TOTAL = 10;let questions = [], cur = 0, score = 0, answered = false, hintsShown = 0;function shuffle(arr) {let a = [...arr];for (let i = a.length - 1; i > 0; i--) {let j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]];}return a;}function startQuiz() {questions = shuffle(ALL_Q).slice(0, TOTAL);cur = 0; score = 0; answered = false; hintsShown = 0;render();}function render() {const app = document.getElementById('app');if (cur >= TOTAL) { renderResult(app); return; }const q = questions[cur];const pct = Math.round((cur / TOTAL) * 100);app.innerHTML = `<div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%"></div></div> <div class="q-header"> <span class="badge ${q.cat === 'Math' ? 'badge-math' : 'badge-sci'}">${q.cat}</span> <span class="q-counter">Question ${cur + 1} / ${TOTAL}</span> </div> <div class="passage">${q.passage}</div> <div class="q-text">${q.q}</div> <div class="options" id="opts"> ${q.opts.map((o, i) =>`<button class="opt-btn" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')} </div> <div class="hint-row"> <button class="hint-btn" id="hb1" onclick="showHint(1)">Hint 1</button> <button class="hint-btn" id="hb2" onclick="showHint(2)" disabled>Hint 2</button> <button class="hint-btn" id="hb3" onclick="showHint(3)" disabled>Hint 3</button> </div> <div id="hint-area"></div> <div id="feedback"></div> <div id="next-area"></div> `;}function showHint(n) {const q = questions[cur];hintsShown = n;let html = '<div class="hint-box">';for (let i = 0; i < n; i++) html += `<p><strong>Hint ${i+1}:</strong> ${q.hints[i]}</p>`;html += '</div>';document.getElementById('hint-area').innerHTML = html;if (n < 3) document.getElementById(`hb${n+1}`).disabled = false;document.getElementById(`hb${n}`).disabled = true;}function choose(idx) {if (answered) return;answered = true;const q = questions[cur];document.querySelectorAll('.opt-btn').forEach((b, i) => {b.disabled = true;if (i === q.ans) b.classList.add('correct');else if (i === idx && idx !== q.ans) b.classList.add('wrong');});const fb = document.getElementById('feedback');if (idx === q.ans) {score++;fb.innerHTML = `<div class="feedback ok"><strong>Correct!</strong> ${q.exp}</div>`;} else {fb.innerHTML = `<div class="feedback ng"><strong>Incorrect.</strong> The correct answer is <strong>${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}</strong>. ${q.exp}</div>`;}const lbl = cur < TOTAL - 1 ? 'Next question →' : 'See results →';document.getElementById('next-area').innerHTML = `<button class="next-btn" onclick="nextQ()">${lbl}</button>`;}function nextQ() { cur++; answered = false; hintsShown = 0; render(); }function renderResult(app) {const pct = Math.round((score / TOTAL) * 100);let msg;if (pct >= 90) msg = "Outstanding! You have an excellent grasp of math and science vocabulary.";else if (pct >= 70) msg = "Great work! Keep reviewing the words you missed to strengthen your knowledge.";else if (pct >= 50) msg = "Good effort! Review the passages again to improve your score.";else msg = "Keep practicing! Reading science and math texts regularly will help you build vocabulary.";app.innerHTML = `<div class="prog-bar-bg"><div class="prog-bar-fill" style="width:100%"></div></div> <div class="result-wrap"> <div class="score-num">${score} / ${TOTAL}</div> <div class="score-lbl">You answered ${score} out of ${TOTAL} questions correctly (${pct}%)</div> <div class="result-msg">${msg}</div> <button class="try-btn" onclick="startQuiz()">Try again</button> </div>`;}startQuiz();</script></body></html>
