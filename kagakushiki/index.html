<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>化学式練習アプリ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f0;
      --surface: #ffffff;
      --surface2: #f0efea;
      --border: #e0ddd4;
      --text: #1a1a18;
      --text2: #6b6b66;
      --text3: #9e9e99;
      --blue: #378ADD;
      --green-bg: #EAF3DE;
      --green-text: #27500A;
      --red-bg: #FCEBEB;
      --red-text: #791F1F;
      --pip-ok: #639922;
      --pip-ng: #E24B4A;
      --radius: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --surface: #252523;
        --surface2: #2e2e2b;
        --border: #3a3a36;
        --text: #f0efe8;
        --text2: #a0a09a;
        --text3: #6a6a65;
        --blue: #5aa3f0;
        --green-bg: #173404;
        --green-text: #C0DD97;
        --red-bg: #501313;
        --red-text: #F7C1C1;
        --pip-ok: #97C459;
        --pip-ng: #F09595;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      width: 100%;
      max-width: 560px;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
    }

    header p {
      font-size: 13px;
      color: var(--text2);
      margin-top: 4px;
    }

    #app {
      width: 100%;
      max-width: 560px;
    }

    /* Score bar */
    .score-bar {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 1rem;
    }
    .score-num { font-size: 22px; font-weight: 500; }
    .score-label { font-size: 13px; color: var(--text2); }
    .score-right { margin-left: auto; font-size: 13px; color: var(--text2); }

    /* Progress pips */
    .progress {
      display: flex;
      gap: 4px;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .pip {
      height: 6px;
      flex: 1;
      min-width: 16px;
      max-width: 40px;
      border-radius: 3px;
      background: var(--border);
    }
    .pip.ok  { background: var(--pip-ok); }
    .pip.ng  { background: var(--pip-ng); }
    .pip.cur { background: var(--blue); }

    /* Question card */
    .q-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }

    .q-num {
      font-size: 12px;
      color: var(--text3);
      margin-bottom: 6px;
    }

    .q-text {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .formula-input {
      flex: 1;
      font-size: 18px;
      font-family: "SF Mono", "Fira Code", monospace;
      letter-spacing: 0.05em;
      padding: 8px 12px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      transition: box-shadow 0.15s;
    }
    .formula-input:focus { box-shadow: 0 0 0 2px #378ADD55; }
    .formula-input:disabled { opacity: 0.6; }

    .btn {
      padding: 8px 18px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: background 0.1s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--border); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    /* Hint */
    .hint-row {
      margin-top: 10px;
    }
    .hint-toggle {
      font-size: 13px;
      font-weight: 500;
      color: var(--blue);
      cursor: pointer;
      background: var(--surface2);
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      padding: 5px 14px;
      transition: background 0.1s;
    }
    .hint-toggle:hover { background: var(--border); }
    .hint-box {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text2);
      display: none;
    }

    /* Feedback */
    .feedback {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 15px;
      display: none;
    }
    .feedback.ok { background: var(--green-bg); color: var(--green-text); display: block; }
    .feedback.ng { background: var(--red-bg);   color: var(--red-text);   display: block; }

    .btn-next {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border-radius: var(--radius);
      background: var(--surface2);
      border: 0.5px solid var(--border);
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      display: none;
    }
    .btn-next:hover { background: var(--border); }

    .hint-note {
      font-size: 14px;
      font-weight: 500;
      color: var(--text2);
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      margin-top: 10px;
    }

    /* Settings */
    .settings {
      margin-bottom: 1.25rem;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .settings label { font-size: 13px; color: var(--text2); }
    .settings select {
      font-size: 13px;
      padding: 4px 8px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
    }

    /* Result */
    .result-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
    }
    .result-score { font-size: 52px; font-weight: 500; }
    .result-msg { font-size: 15px; color: var(--text2); margin: 8px 0 1.5rem; }
    .wrong-list { margin-top: 1.5rem; text-align: left; }
    .wrong-title { font-size: 13px; color: var(--text2); margin-bottom: 6px; }
    .wrong-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 0.5px solid var(--border);
      font-size: 15px;
    }
    .wrong-formula {
      font-family: "SF Mono", "Fira Code", monospace;
      color: var(--text2);
    }
    .btn-retry-wrap { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <h1>化学式練習</h1>
    <p>中学理科・化学式テスト対策</p>
  </header>
  <div id="app"></div>

  <script>
  const ALL = [
    // 単体（気体）
    { name: "水素",     formula: "H₂",       category: "単体" },
    { name: "酸素",     formula: "O₂",       category: "単体" },
    { name: "窒素",     formula: "N₂",       category: "単体" },
    { name: "塩素",     formula: "Cl₂",      category: "単体" },
    { name: "フッ素",   formula: "F₂",       category: "単体" },
    { name: "ヨウ素",   formula: "I₂",       category: "単体" },
    { name: "ナトリウム", formula: "Na",      category: "単体" },
    { name: "マグネシウム", formula: "Mg",   category: "単体" },
    { name: "アルミニウム", formula: "Al",   category: "単体" },
    { name: "銅",       formula: "Cu",       category: "単体" },
    { name: "鉄",       formula: "Fe",       category: "単体" },
    { name: "銀",       formula: "Ag",       category: "単体" },
    { name: "炭素",     formula: "C",        category: "単体" },
    { name: "硫黄",     formula: "S",        category: "単体" },
    // 化合物（無機）
    { name: "水",             formula: "H₂O",      category: "化合物" },
    { name: "二酸化炭素",     formula: "CO₂",      category: "化合物" },
    { name: "一酸化炭素",     formula: "CO",       category: "化合物" },
    { name: "アンモニア",     formula: "NH₃",      category: "化合物" },
    { name: "塩化水素",       formula: "HCl",      category: "化合物" },
    { name: "二酸化硫黄",     formula: "SO₂",      category: "化合物" },
    { name: "二酸化窒素",     formula: "NO₂",      category: "化合物" },
    { name: "塩化ナトリウム", formula: "NaCl",     category: "化合物" },
    { name: "炭酸水素ナトリウム", formula: "NaHCO₃", category: "化合物" },
    { name: "炭酸ナトリウム", formula: "Na₂CO₃",  category: "化合物" },
    { name: "水酸化ナトリウム", formula: "NaOH",   category: "化合物" },
    { name: "水酸化カルシウム", formula: "Ca(OH)₂", category: "化合物" },
    { name: "炭酸カルシウム", formula: "CaCO₃",   category: "化合物" },
    { name: "塩化カルシウム", formula: "CaCl₂",   category: "化合物" },
    { name: "硫酸",           formula: "H₂SO₄",   category: "化合物" },
    { name: "硝酸",           formula: "HNO₃",    category: "化合物" },
    { name: "塩酸（塩化水素水溶液）", formula: "HCl", category: "化合物" },
    // 酸化物
    { name: "酸化銅",         formula: "CuO",      category: "酸化物" },
    { name: "酸化鉄",         formula: "Fe₂O₃",   category: "酸化物" },
    { name: "酸化マグネシウム", formula: "MgO",   category: "酸化物" },
    { name: "酸化銀",         formula: "Ag₂O",    category: "酸化物" },
    { name: "酸化アルミニウム", formula: "Al₂O₃", category: "酸化物" },
    { name: "酸化カルシウム", formula: "CaO",     category: "酸化物" },
    // 硫化物・塩化物
    { name: "硫化鉄",         formula: "FeS",      category: "硫化物・塩化物" },
    { name: "硫化銅",         formula: "CuS",      category: "硫化物・塩化物" },
    { name: "硫化水素",       formula: "H₂S",      category: "硫化物・塩化物" },
    { name: "塩化銅",         formula: "CuCl₂",   category: "硫化物・塩化物" },
    { name: "塩化鉄(III)",    formula: "FeCl₃",   category: "硫化物・塩化物" },
    { name: "塩化アンモニウム", formula: "NH₄Cl", category: "硫化物・塩化物" },
  ];

  const HINTS = {
    "H₂": "水素原子2個（二原子分子）", "O₂": "酸素原子2個（二原子分子）",
    "N₂": "窒素原子2個（二原子分子）", "Cl₂": "塩素原子2個（二原子分子）",
    "F₂": "フッ素原子2個", "I₂": "ヨウ素原子2個",
    "Na": "単原子", "Mg": "単原子", "Al": "単原子",
    "Cu": "単原子", "Fe": "単原子", "Ag": "単原子",
    "C": "単原子", "S": "単原子",
    "H₂O": "H×2, O×1", "CO₂": "C×1, O×2", "CO": "C×1, O×1",
    "NH₃": "N×1, H×3", "HCl": "H×1, Cl×1", "SO₂": "S×1, O×2",
    "NO₂": "N×1, O×2", "NaCl": "Na×1, Cl×1",
    "NaHCO₃": "Na×1, H×1, C×1, O×3", "Na₂CO₃": "Na×2, C×1, O×3",
    "NaOH": "Na×1, O×1, H×1", "Ca(OH)₂": "Ca×1, O×2, H×2",
    "CaCO₃": "Ca×1, C×1, O×3", "CaCl₂": "Ca×1, Cl×2",
    "H₂SO₄": "H×2, S×1, O×4", "HNO₃": "H×1, N×1, O×3",
    "CuO": "Cu×1, O×1", "Fe₂O₃": "Fe×2, O×3", "MgO": "Mg×1, O×1",
    "Ag₂O": "Ag×2, O×1", "Al₂O₃": "Al×2, O×3", "CaO": "Ca×1, O×1",
    "FeS": "Fe×1, S×1", "CuS": "Cu×1, S×1", "H₂S": "H×2, S×1",
    "CuCl₂": "Cu×1, Cl×2", "FeCl₃": "Fe×1, Cl×3", "NH₄Cl": "N×1, H×4, Cl×1",
  };

  function toAscii(s) {
    return s.replace(/[₀-₉]/g, c => String.fromCharCode(c.charCodeAt(0) - 8272));
  }
  function matches(input, formula) {
    const i = input.trim();
    const f = formula;
    return i === f || i === toAscii(f) ||
           i.toUpperCase() === f.toUpperCase() ||
           i.toUpperCase() === toAscii(f).toUpperCase();
  }
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // State
  let questions = [], cur = 0, results = [], answered = false;
  let qCount = 10, filterCat = "すべて";

  const CATEGORIES = ["すべて", "単体", "化合物", "酸化物", "硫化物・塩化物"];

  function startQuiz() {
    const pool = filterCat === "すべて" ? ALL : ALL.filter(q => q.category === filterCat);
    const n = Math.min(qCount, pool.length);
    questions = shuffle(pool).slice(0, n);
    cur = 0; results = []; answered = false;
    render();
  }

  function render() {
    const app = document.getElementById('app');
    if (cur >= questions.length) { renderResult(app); return; }
    const q = questions[cur];

    const pips = questions.map((_, i) => {
      let cls = 'pip';
      if (i < cur) cls += results[i] ? ' ok' : ' ng';
      else if (i === cur) cls += ' cur';
      return `<div class="${cls}"></div>`;
    }).join('');

    app.innerHTML = `
      <div class="settings">
        <label>問題数</label>
        <select id="sel-count">
          ${[5,10,15,20].map(n => `<option value="${n}"${n===qCount?' selected':''}>${n}問</option>`).join('')}
        </select>
        <label>カテゴリ</label>
        <select id="sel-cat">
          ${CATEGORIES.map(c => `<option${c===filterCat?' selected':''}>${c}</option>`).join('')}
        </select>
        <button class="btn" id="btn-restart">最初から</button>
      </div>

      <div class="score-bar">
        <span class="score-num">${results.filter(Boolean).length}</span>
        <span class="score-label">/ ${cur} 正解</span>
        <span class="score-right">${cur + 1} / ${questions.length}問</span>
      </div>
      <div class="progress">${pips}</div>

      <div class="q-card">
        <div class="q-num">問 ${cur + 1}　<span style="color:var(--text3)">${q.category}</span></div>
        <div class="q-text">「${q.name}」の化学式は？</div>
        <div class="input-row">
          <input class="formula-input" id="ans" placeholder="例: H2O, CuCl2" autocomplete="off" spellcheck="false" />
          <button class="btn" id="btn-check">確認</button>
        </div>
        <div class="hint-row">
          <button class="hint-toggle" id="hint-toggle">ヒントを見る</button>
          <div class="hint-box" id="hint-box">${HINTS[q.formula] || ''}</div>
        </div>
        <div class="feedback" id="fb"></div>
        <button class="btn-next" id="btn-next">${cur + 1 < questions.length ? '次の問題 →' : '結果を見る'}</button>
      </div>
      <p class="hint-note">✏️ 入力例: H2O, CuCl2, Fe2O3, NaHCO3 など（小さい数字はそのまま普通の数字でOK）</p>
    `;

    document.getElementById('sel-count').onchange = e => { qCount = +e.target.value; };
    document.getElementById('sel-cat').onchange = e => { filterCat = e.target.value; };
    document.getElementById('btn-restart').onclick = startQuiz;

    const inp = document.getElementById('ans');
    const chk = document.getElementById('btn-check');
    const fb  = document.getElementById('fb');
    const nxt = document.getElementById('btn-next');
    const ht  = document.getElementById('hint-toggle');
    const hb  = document.getElementById('hint-box');

    ht.onclick = () => {
      const show = hb.style.display === 'block';
      hb.style.display = show ? 'none' : 'block';
      ht.textContent = show ? 'ヒントを見る' : 'ヒントを隠す';
    };

    function check() {
      if (answered) return;
      const ok = matches(inp.value, q.formula);
      answered = true;
      results.push(ok);
      fb.textContent = ok ? `⭕ 正解！　${q.formula}` : `❌ 不正解　正解は ${q.formula}`;
      fb.className = 'feedback ' + (ok ? 'ok' : 'ng');
      nxt.style.display = 'block';
      chk.disabled = true;
      inp.disabled = true;
    }

    chk.onclick = check;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    nxt.onclick = () => { cur++; answered = false; render(); };
    inp.focus();
  }

  function renderResult(app) {
    const sc = results.filter(Boolean).length;
    const total = questions.length;
    const pct = Math.round(sc / total * 100);
    const msg = sc === total ? '満点！完璧です 🎉'
              : pct >= 80 ? 'すばらしい！'
              : pct >= 60 ? 'もう少し！'
              : 'もっと練習しましょう';
    const wrong = questions.filter((_, i) => !results[i]);
    const wrongHtml = wrong.length ? `
      <div class="wrong-list">
        <div class="wrong-title">間違えた問題</div>
        ${wrong.map(q => `
          <div class="wrong-row">
            <span>${q.name}</span>
            <span class="wrong-formula">${q.formula}</span>
          </div>`).join('')}
      </div>` : '';

    app.innerHTML = `
      <div class="result-card">
        <div class="result-score">${sc} / ${total}</div>
        <div class="result-msg">${msg}</div>
        <div class="btn-retry-wrap">
          <button class="btn" id="btn-retry-wrong" ${wrong.length === 0 ? 'disabled' : ''}>
            間違えた${wrong.length}問だけやり直す
          </button>
          <button class="btn" id="btn-retry-new">新しい${qCount}問</button>
        </div>
        ${wrongHtml}
      </div>`;

    document.getElementById('btn-retry-new').onclick = startQuiz;
    document.getElementById('btn-retry-wrong').onclick = () => {
      if (wrong.length === 0) return;
      questions = wrong;
      cur = 0; results = []; answered = false;
      render();
    };
  }

  startQuiz();
  </script>
</body>
</html>
