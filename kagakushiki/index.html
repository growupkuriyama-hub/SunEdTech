<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>化学式練習アプリ🍰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FAF9F6;
      --surface: #ffffff;
      --surface2: #FFF5F7;
      --border: #F0EAE3;
      --text: #5D564F;
      --text2: #8C847C;
      --text3: #C2BBB5;
      --main-color: #79C9C1;
      --main-color-hover: #67B0A8;
      --accent-pink: #FFB7C5;
      --green-bg: #EDF7F1;
      --green-text: #4A8561;
      --red-bg: #FFF0F0;
      --red-text: #BF5A5A;
      --pip-ok: #98D9B4;
      --pip-ng: #FFABAB;
      --radius: 12px;
      --radius-lg: 20px;
      --shadow: 0 8px 20px rgba(180, 160, 140, 0.1);
      --font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #2D2A27;
        --surface: #383430;
        --surface2: #403B37;
        --border: #4A4540;
        --text: #F2EFEA;
        --text2: #D1CAC2;
        --text3: #968F88;
        --main-color: #8DDFD7;
        --accent-pink: #FFC9D4;
        --green-bg: #243D30;
        --green-text: #A8D9BD;
        --red-bg: #472929;
        --red-text: #FFB3B3;
        --pip-ok: #81C79D;
        --pip-ng: #E58989;
        --shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      }
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3.5rem 1rem 2.5rem;
      letter-spacing: 0.02em;
    }

    header {
      width: 100%;
      max-width: 580px;
      margin-bottom: 2.5rem;
      text-align: center;
      background: var(--surface);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      border: 1px solid var(--surface);
    }
    @media (prefers-color-scheme: dark) {
      header { border-color: var(--border); }
    }

    .header-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--main-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1::before, header h1::after { content: '🧪'; font-size: 0.8em; }

    header p {
      font-size: 14px;
      color: var(--text2);
      background: var(--surface2);
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
    }

    .btn-back {
      position: fixed;
      top: 14px;
      left: 16px;
      z-index: 100;
      font-size: 12px;
      font-weight: 500;
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      background-color: var(--accent-pink);
      border-radius: 20px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(255, 183, 197, 0.4);
    }
    .btn-back:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 12px rgba(255, 183, 197, 0.5);
    }

    #app {
      width: 100%;
      max-width: 580px;
    }

    .score-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
      padding: 0 10px;
    }
    .score-num { font-size: 26px; font-weight: 700; color: var(--main-color); }
    .score-label { font-size: 14px; color: var(--text2); font-weight: 500; }
    .score-right { margin-left: auto; font-size: 14px; color: var(--text2); background: var(--surface); padding: 4px 12px; border-radius: 20px; box-shadow: var(--shadow); }

    .progress {
      display: flex;
      gap: 6px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      padding: 0 5px;
    }
    .pip {
      height: 10px;
      flex: 1;
      min-width: 18px;
      max-width: 40px;
      border-radius: 5px;
      background: var(--border);
      transition: all 0.3s ease;
    }
    .pip.ok  { background: var(--pip-ok); box-shadow: 0 2px 5px rgba(152, 217, 180, 0.4); }
    .pip.ng  { background: var(--pip-ng); box-shadow: 0 2px 5px rgba(255, 171, 171, 0.4); }
    .pip.cur { background: var(--accent-pink); transform: scaleY(1.2); box-shadow: 0 2px 5px rgba(255, 183, 197, 0.4); }

    .q-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--surface);
      position: relative;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      .q-card { border-color: var(--border); }
    }
    .q-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--main-color), var(--accent-pink));
    }

    .q-num {
      font-size: 13px;
      color: var(--text3);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .q-text {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--text);
    }
    .q-text span.q-name {
      color: var(--main-color);
      position: relative;
      display: inline-block;
    }
    .q-text span.q-name::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0; width: 100%; height: 3px;
      background: var(--accent-pink);
      border-radius: 2px;
      opacity: 0.5;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .formula-input {
      flex: 1;
      font-size: 20px;
      font-family: "SF Mono", "Fira Code", Courier, monospace;
      letter-spacing: 0.08em;
      padding: 12px 16px;
      background: var(--surface2);
      border: 2px solid var(--surface2);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }
    .formula-input:focus {
      background: var(--surface);
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 4px rgba(255, 183, 197, 0.2);
    }
    .formula-input:disabled { opacity: 0.6; }
    .formula-input::placeholder { color: var(--text3); font-family: var(--font-family); font-size: 16px; letter-spacing: 0; }

    .btn {
      padding: 10px 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text2);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: var(--font-family);
    }
    .btn:hover:not(:disabled) {
      background: var(--border);
      color: var(--text);
      transform: translateY(-1px);
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    #btn-check {
      background-color: var(--main-color);
      color: white;
      border: none;
      box-shadow: 0 4px 10px rgba(121, 201, 193, 0.3);
    }
    #btn-check:hover:not(:disabled) {
      background-color: var(--main-color-hover);
      box-shadow: 0 6px 12px rgba(121, 201, 193, 0.4);
    }

    .hint-row {
      margin-top: 10px;
    }
    .hint-toggle {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-pink);
      cursor: pointer;
      background: none;
      border: none;
      padding: 5px 0;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-family);
    }
    .hint-toggle:hover { color: var(--text); }
    .hint-toggle::before { content: '💡'; }

    .hint-box {
      margin-top: 8px;
      font-size: 14px;
      color: var(--text2);
      display: none;
      background: var(--surface2);
      padding: 12px;
      border-radius: var(--radius);
      border-left: 4px solid var(--accent-pink);
    }

    .feedback {
      margin-top: 15px;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      display: none;
      animation: popIn 0.3s ease;
    }
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .feedback.ok { background: var(--green-bg); color: var(--green-text); display: block; border: 1px solid rgba(74, 133, 97, 0.2); }
    .feedback.ng { background: var(--red-bg);   color: var(--red-text);   display: block; border: 1px solid rgba(191, 90, 90, 0.2); }

    .btn-next {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--main-color), var(--accent-pink));
      border: none;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      transition: all 0.2s ease;
      box-shadow: 0 5px 15px rgba(255, 183, 197, 0.4);
      font-family: var(--font-family);
    }
    .btn-next:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 183, 197, 0.5);
    }

    /* スキップボタン: 常に押せそうな見た目、ただし控えめ */
    .btn-skip {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      border-radius: var(--radius);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-family);
    }
    .btn-skip:hover:not(:disabled) {
      background: var(--border);
      color: var(--text);
      transform: translateY(-1px);
    }
    .btn-skip:active:not(:disabled) { transform: translateY(1px); }
    .btn-skip:disabled { opacity: 0.4; cursor: default; }

    .hint-note {
      font-size: 14px;
      font-weight: 500;
      color: var(--text2);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 1.5rem;
      box-shadow: var(--shadow);
      text-align: center;
      border: 1px solid var(--surface);
    }
    @media (prefers-color-scheme: dark) {
      .hint-note { border-color: var(--border); }
    }

    .settings {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 12px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--surface);
    }
    @media (prefers-color-scheme: dark) {
      .settings { border-color: var(--border); }
    }
    .settings label { font-size: 13px; color: var(--text2); font-weight: 600; margin-right: -4px; }
    .settings select {
      font-size: 13px;
      padding: 6px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-family: var(--font-family);
      cursor: pointer;
      outline: none;
    }
    .settings select:focus { border-color: var(--accent-pink); }

    #btn-restart {
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 20px;
      background: var(--accent-pink);
      color: white;
      border: none;
      margin-left: auto;
    }

    .result-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--surface);
      position: relative;
    }
    @media (prefers-color-scheme: dark) {
      .result-card { border-color: var(--border); }
    }
    .result-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 8px;
      background: linear-gradient(90deg, var(--main-color), var(--accent-pink));
    }
    .result-score { font-size: 60px; font-weight: 800; color: var(--main-color); line-height: 1; margin-bottom: 10px; }
    .result-msg { font-size: 18px; font-weight: 600; color: var(--text); margin: 10px 0 2rem; background: var(--surface2); padding: 8px; border-radius: var(--radius); }

    .wrong-list { margin-top: 2rem; text-align: left; background: var(--surface2); padding: 1.5rem; border-radius: var(--radius); }
    .wrong-title { font-size: 15px; font-weight: 700; color: var(--red-text); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .wrong-title::before { content: '🖍️'; }
    .wrong-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 16px;
    }
    .wrong-row:last-child { border-bottom: none; }
    .wrong-name { color: var(--text); font-weight: 500; }
    .wrong-formula {
      font-family: "SF Mono", "Fira Code", monospace;
      color: var(--text2);
      font-weight: 600;
      background: var(--surface);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .btn-retry-wrap { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }

    #btn-retry-new {
      background: linear-gradient(135deg, var(--main-color), var(--accent-pink));
      color: white;
      border: none;
      box-shadow: 0 4px 12px rgba(255, 183, 197, 0.4);
    }
    #btn-retry-wrong {
      border: 1px solid var(--red-text);
      color: var(--red-text);
      background: var(--red-bg);
    }
    #btn-retry-wrong:hover:not(:disabled) { background: #FFDADA; }
  </style>
</head>
<body>
  <a class="btn-back" href="https://sun-ed-tech.vercel.app/" target="_blank" rel="noopener">← サイトに戻る</a>
  <header>
    <div class="header-top">
      <h1>化学式練習</h1>
      <p>中学理科・化学式テスト対策</p>
    </div>
  </header>
  <div id="app"></div>

  <script>
  const ALL = [
    { name: "水素",     formula: "H₂",       category: "単体" },
    { name: "酸素",     formula: "O₂",       category: "単体" },
    { name: "窒素",     formula: "N₂",       category: "単体" },
    { name: "塩素",     formula: "Cl₂",      category: "単体" },
    { name: "フッ素",   formula: "F₂",       category: "単体" },
    { name: "ヨウ素",   formula: "I₂",       category: "単体" },
    { name: "ナトリウム", formula: "Na",      category: "単体" },
    { name: "マグネシウム", formula: "Mg",   category: "単体" },
    { name: "アルミニウム", formula: "Al",   category: "単体" },
    { name: "銅",       formula: "Cu",       category: "単体" },
    { name: "鉄",       formula: "Fe",       category: "単体" },
    { name: "銀",       formula: "Ag",       category: "単体" },
    { name: "炭素",     formula: "C",        category: "単体" },
    { name: "硫黄",     formula: "S",        category: "単体" },
    { name: "水",             formula: "H₂O",      category: "化合物" },
    { name: "二酸化炭素",     formula: "CO₂",      category: "化合物" },
    { name: "一酸化炭素",     formula: "CO",       category: "化合物" },
    { name: "アンモニア",     formula: "NH₃",      category: "化合物" },
    { name: "塩化水素",       formula: "HCl",      category: "化合物" },
    { name: "二酸化硫黄",     formula: "SO₂",      category: "化合物" },
    { name: "二酸化窒素",     formula: "NO₂",      category: "化合物" },
    { name: "塩化ナトリウム", formula: "NaCl",     category: "化合物" },
    { name: "炭酸水素ナトリウム", formula: "NaHCO₃", category: "化合物" },
    { name: "炭酸ナトリウム", formula: "Na₂CO₃",  category: "化合物" },
    { name: "水酸化ナトリウム", formula: "NaOH",   category: "化合物" },
    { name: "水酸化カルシウム", formula: "Ca(OH)₂", category: "化合物" },
    { name: "炭酸カルシウム", formula: "CaCO₃",   category: "化合物" },
    { name: "塩化カルシウム", formula: "CaCl₂",   category: "化合物" },
    { name: "硫酸",           formula: "H₂SO₄",   category: "化合物" },
    { name: "硝酸",           formula: "HNO₃",    category: "化合物" },
    { name: "塩酸（塩化水素水溶液）", formula: "HCl", category: "化合物" },
    { name: "酸化銅",         formula: "CuO",      category: "酸化物" },
    { name: "酸化鉄",         formula: "Fe₂O₃",   category: "酸化物" },
    { name: "酸化マグネシウム", formula: "MgO",   category: "酸化物" },
    { name: "酸化銀",         formula: "Ag₂O",    category: "酸化物" },
    { name: "酸化アルミニウム", formula: "Al₂O₃", category: "酸化物" },
    { name: "酸化カルシウム", formula: "CaO",     category: "酸化物" },
    { name: "硫化鉄",         formula: "FeS",      category: "硫化物・塩化物" },
    { name: "硫化銅",         formula: "CuS",      category: "硫化物・塩化物" },
    { name: "硫化水素",       formula: "H₂S",      category: "硫化物・塩化物" },
    { name: "塩化銅",         formula: "CuCl₂",   category: "硫化物・塩化物" },
    { name: "塩化鉄(III)",    formula: "FeCl₃",   category: "硫化物・塩化物" },
    { name: "塩化アンモニウム", formula: "NH₄Cl", category: "硫化物・塩化物" },
  ];

  const HINTS = {
    "H₂": "水素原子2個（二原子分子）", "O₂": "酸素原子2個（二原子分子）",
    "N₂": "窒素原子2個（二原子分子）", "Cl₂": "塩素原子2個（二原子分子）",
    "F₂": "フッ素原子2個", "I₂": "ヨウ素原子2個",
    "Na": "単原子", "Mg": "単原子", "Al": "単原子",
    "Cu": "単原子", "Fe": "単原子", "Ag": "単原子",
    "C": "炭素＝カーボン＝C", "S": "単原子",
    "H₂O": "H×2, O×1", "CO₂": "C×1, O×2", "CO": "C×1, O×1",
    "NH₃": "N×1, H×3", "HCl": "H×1, Cl×1", "SO₂": "S×1, O×2",
    "NO₂": "N×1, O×2", "NaCl": "Na×1, Cl×1",
    "NaHCO₃": "Na×1, H×1, C×1, O×3", "Na₂CO₃": "Na×2, C×1, O×3",
    "NaOH": "Na×1, O×1, H×1", "Ca(OH)₂": "Ca×1, O×2, H×2",
    "CaCO₃": "Ca×1, C×1, O×3", "CaCl₂": "Ca×1, Cl×2",
    "H₂SO₄": "H×2, S×1, O×4", "HNO₃": "H×1, N×1, O×3",
    "CuO": "Cu×1, O×1", "Fe₂O₃": "Fe×2, O×3", "MgO": "Mg×1, O×1",
    "Ag₂O": "Ag×2, O×1", "Al₂O₃": "Al×2, O×3", "CaO": "Ca×1, O×1",
    "FeS": "Fe×1, S×1", "CuS": "Cu×1, S×1", "H₂S": "H×2, S×1",
    "CuCl₂": "Cu×1, Cl×2", "FeCl₃": "Fe×1, Cl×3", "NH₄Cl": "N×1, H×4, Cl×1",
  };

  function toAscii(s) {
    return s.replace(/[₀-₉]/g, c => String.fromCharCode(c.charCodeAt(0) - 8272));
  }
  function matches(input, formula) {
    const i = input.trim();
    const f = formula;
    return i === f || i === toAscii(f) ||
           i.toUpperCase() === f.toUpperCase() ||
           i.toUpperCase() === toAscii(f).toUpperCase();
  }
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let questions = [], cur = 0, results = [], answered = false;
  let qCount = 10, filterCat = "すべて";

  const CATEGORIES = ["すべて", "単体", "化合物", "酸化物", "硫化物・塩化物"];

  function startQuiz() {
    const pool = (filterCat === "すべて" ? ALL : ALL.filter(q => q.category === filterCat))
      .map(q => { const c = {...q}; delete c._skipped; return c; });
    const n = Math.min(qCount, pool.length);
    questions = shuffle(pool).slice(0, n);
    cur = 0; results = []; answered = false;
    render();
  }

  function render() {
    const app = document.getElementById('app');
    if (cur >= questions.length) { renderResult(app); return; }
    const q = questions[cur];

    const pips = questions.map((_, i) => {
      let cls = 'pip';
      if (i < cur) cls += results[i] ? ' ok' : ' ng';
      else if (i === cur) cls += ' cur';
      return `<div class="${cls}"></div>`;
    }).join('');

    app.innerHTML = `
      <div class="settings">
        <label>問題数</label>
        <select id="sel-count">
          ${[5,10,15,20].map(n => `<option value="${n}"${n===qCount?' selected':''}>${n}問</option>`).join('')}
        </select>
        <label>カテゴリ</label>
        <select id="sel-cat">
          ${CATEGORIES.map(c => `<option${c===filterCat?' selected':''}>${c}</option>`).join('')}
        </select>
        <button class="btn" id="btn-restart">最初から</button>
      </div>

      <div class="score-bar">
        <span class="score-num">${results.filter(Boolean).length}</span>
        <span class="score-label">/ ${cur} 正解</span>
        <span class="score-right">${cur + 1} / ${questions.length}問</span>
      </div>
      <div class="progress">${pips}</div>

      <div class="q-card">
        <div class="q-num">問 ${cur + 1}　<span style="color:var(--text3); font-weight:600;">${q.category}</span></div>
        <div class="q-text">「<span class="q-name">${q.name}</span>」の化学式は？</div>
        <div class="input-row">
          <input class="formula-input" id="ans" placeholder="例: H2O, CuCl2" autocomplete="off" spellcheck="false" inputmode="latin" />
          <button class="btn" id="btn-check">確認</button>
        </div>
        <div class="hint-row">
          <button class="hint-toggle" id="hint-toggle">ヒントを見る</button>
          <div class="hint-box" id="hint-box">${HINTS[q.formula] || ''}</div>
        </div>
        <div class="feedback" id="fb"></div>
        <button class="btn-next" id="btn-next">${cur + 1 < questions.length ? '次の問題へ　→' : '結果を見る ✨'}</button>
        <button class="btn-skip" id="btn-skip">この問題をスキップ</button>
      </div>
      <p class="hint-note">✏️ 入力例: H2O, CuCl2, Fe2O3, NaHCO3 など<br>(小さい数字は普通の数字でOK)</p>
    `;

    document.getElementById('sel-count').onchange = e => { qCount = +e.target.value; };
    document.getElementById('sel-cat').onchange = e => { filterCat = e.target.value; };
    document.getElementById('btn-restart').onclick = startQuiz;

    const inp = document.getElementById('ans');
    const chk = document.getElementById('btn-check');
    const fb  = document.getElementById('fb');
    const nxt = document.getElementById('btn-next');
    const skp = document.getElementById('btn-skip');
    const ht  = document.getElementById('hint-toggle');
    const hb  = document.getElementById('hint-box');

    ht.onclick = () => {
      const show = hb.style.display === 'block';
      hb.style.display = show ? 'none' : 'block';
      ht.textContent = show ? 'ヒントを見る' : 'ヒントを隠す';
    };

    function check() {
      if (answered) return;
      const ok = matches(inp.value, q.formula);
      answered = true;
      results.push(ok);
      fb.innerHTML = ok ? `<span>⭕</span> 正解！　${q.formula}` : `<span>❌</span> 不正解… 正解は ${q.formula}`;
      fb.className = 'feedback ' + (ok ? 'ok' : 'ng');
      nxt.style.display = 'block';
      chk.disabled = true;
      inp.disabled = true;
    }

    chk.onclick = check;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    nxt.onclick = () => { cur++; answered = false; render(); };

    skp.onclick = () => {
      if (answered) {
        cur++; answered = false; render();
        return;
      }
      const skipped = questions.splice(cur, 1)[0];
      if (!skipped._skipped) {
        skipped._skipped = true;
        questions.push(skipped);
      } else {
        results.push(false);
        cur++;
      }
      answered = false;
      render();
    };

    inp.focus();
  }

  function renderResult(app) {
    const sc = results.filter(Boolean).length;
    const total = questions.length;
    const pct = Math.round(sc / total * 100);
    const msg = sc === total ? '満点！すごすぎます 🎉Perfect!'
              : pct >= 80 ? 'すばらしいです！🌸'
              : pct >= 60 ? '合格点！その調子です♪'
              : '伸びしろいっぱい！次がんばろう💖';
    const wrong = questions.filter((_, i) => !results[i]);
    const wrongHtml = wrong.length ? `
      <div class="wrong-list">
        <div class="wrong-title">復習しよう（間違えた問題）</div>
        ${wrong.map(q => `
          <div class="wrong-row">
            <span class="wrong-name">${q.name}</span>
            <span class="wrong-formula">${q.formula}</span>
          </div>`).join('')}
      </div>` : '';

    app.innerHTML = `
      <div class="result-card">
        <div class="result-score">${sc} / ${total}</div>
        <div class="result-msg">${msg}</div>
        <div class="btn-retry-wrap">
          <button class="btn" id="btn-retry-wrong" ${wrong.length === 0 ? 'disabled' : ''}>
            間違えた${wrong.length}問だけリトライ
          </button>
          <button class="btn" id="btn-retry-new">新しい問題に挑戦 🚀</button>
        </div>
        ${wrongHtml}
      </div>`;

    document.getElementById('btn-retry-new').onclick = startQuiz;
    document.getElementById('btn-retry-wrong').onclick = () => {
      if (wrong.length === 0) return;
      questions = wrong.map(q => { const c = {...q}; delete c._skipped; return c; });
      cur = 0; results = []; answered = false;
      render();
    };
  }

  startQuiz();
  </script>
</body>
</html>
